              "pre_first_hold_warmup_policy": pre_first_hold_warmup_policy,
              "pre_first_hold_warmup_arm": pre_first_hold_warmup_arm,
              "pre_first_hold_warmup_ms": pre_first_hold_warmup_ms,
              "pre_first_hold_warmup_applied": pre_first_hold_warmup_applied,
              "signup_country_policy": signup_country_policy,
              "signup_country_arm": signup_country_arm,
              "signup_country_code": signup_country_code,
              "signup_country_applied": signup_country_applied,
              "signup_dob_policy": signup_dob_policy,
              "signup_dob_arm": signup_dob_arm,
              "signup_dob_mode": signup_dob_mode,
              "signup_dob_applied": signup_dob_applied,
              "email_domain_policy": email_domain_policy,
              "email_domain_arm": email_domain_arm,
              "email_domain": email_domain_value,
              "email_domain_applied": email_domain_applied,
              "coordinator_mode": os.environ.get("COORDINATOR_MODE", ""),
              "max_parallel": int(os.environ.get("MAX_PARALLEL", "0")),
              "runtime_mode": os.environ.get("RUNTIME_MODE", ""),
              "probe_timeout_minutes": int(os.environ.get("PROBE_TIMEOUT_MINUTES", "0")),
              "job_timeout_minutes": int(os.environ.get("JOB_TIMEOUT_MINUTES", "0")),
              "probe_exit_code": os.environ.get("PROBE_EXIT_CODE", ""),
              "category": category,
              "reason": reason,
              "strict_success": strict_success,
              "account_lifecycle": account_lifecycle,
              "graph_import_attempted": graph_import_attempted,
              "graph_import_ok": graph_import_ok,
              "graph_import_attempts": graph_import_attempts,
              "graph_retry_scheduled": graph_retry_scheduled,
              "graph_backend_attempt_count": graph_backend_attempt_count,
              "graph_import_error_code": graph_import_error,
              "explicit_riskblock": explicit_riskblock,
              "accepted_result0": accepted_result0,
              "post_success_rechallenge": post_success_rechallenge,
              "fresh_rechallenge_absolute_timed_out": fresh_absolute_timed_out,
              "fresh_rechallenge_idle_timed_out": fresh_idle_timed_out,
              "fresh_rechallenge_policy_skipped": fresh_policy_skipped,
              "human_loaded": int(row.get("human_loaded") or 0),
              "human_success": int(row.get("human_success") or 0),
              "create_request": bool(row.get("create_request")),
              "probe_timed_out": timed_out,
              "coordinator_final_reservations": len(coordinator_final_wait_ms),
              "coordinator_final_wait_ms": coordinator_final_wait_ms,
              "coordinator_final_gap_ms": sorted(set(coordinator_final_gap_ms)),
              "coordinator_final_global_gap_ms": sorted(
                  set(coordinator_final_global_gap_ms)
              ),
              "coordinator_final_window_wait_ms": coordinator_final_window_wait_ms,
              "coordinator_lane_hashes": sorted(coordinator_lane_hashes),
          }
          out = Path("public-safe-verdict") / f"verdict-{safe['attempt']}.json"
          out.write_text(json.dumps(safe, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(safe, ensure_ascii=False))
          PY

      - name: Upload redacted verdict artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ga-safe-verdict-${{ github.run_id }}-${{ matrix.attempt }}
          path: public-safe-verdict/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Encrypt evidence before public artifact upload
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESULTS_ENCRYPTION_CERT_B64:-}"
          mkdir -p public-artifacts .public-encryption
          printf '%s' "$RESULTS_ENCRYPTION_CERT_B64" | base64 -d > .public-encryption/results_public_cert.pem
          tar -C Results -czf .public-encryption/results.tar.gz .
          openssl cms -encrypt -binary -aes-256-cbc \
            -in .public-encryption/results.tar.gz \
            -out public-artifacts/evidence-${{ github.run_id }}-${{ matrix.attempt }}.cms \
            -outform DER \
            .public-encryption/results_public_cert.pem
          rm -rf .public-encryption

      - name: Upload encrypted evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ga-encrypted-${{ inputs.variant }}-${{ github.run_id }}-${{ matrix.attempt }}
          path: public-artifacts/*.cms
          if-no-files-found: error
          retention-days: 3

      - name: Enforce no non-IP technical failure for exact release variants
        if: ${{ always() && startsWith(inputs.variant, 'release_5s_success_') }}
        shell: bash
        run: |
          set -euo pipefail
          verdict=$(ls -t public-safe-verdict/verdict-*.json 2>/dev/null | head -n1 || true)
          if [ -z "$verdict" ]; then
            echo "technical failure: no public-safe verdict"
            exit 1
          fi
          VERDICT_PATH="$verdict" python - <<'PY'
          import json
          import os
          from pathlib import Path
          row = json.loads(Path(os.environ['VERDICT_PATH']).read_text(encoding='utf-8'))
          category = str(row.get('category') or '')
          acceptable = category in {
              'strict_success',
              'technical_pass_ip_blocked',
              'ip_riskblock',
              'ip_skipped',
          }
          print(json.dumps({
              'category': category,
              'reason': row.get('reason'),
              'strict_success': row.get('strict_success'),
              'accepted_result0': row.get('accepted_result0'),
              'explicit_riskblock': row.get('explicit_riskblock'),
              'acceptable_for_non_ip_goal': acceptable,
          }, ensure_ascii=False))
          raise SystemExit(0 if acceptable else 1)
          PY

  summarize:
    if: ${{ always() }}
    needs: own-ip-probe
    runs-on: ubuntu-22.04
    steps:
      - name: Download redacted slot verdicts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ga-safe-verdict-${{ github.run_id }}-*
          path: safe-verdicts
          merge-multiple: true

      - name: Evaluate non-IP path goal
        shell: bash
        env:
          EXPECTED_SLOTS_JSON: ${{ inputs.node_slots_json }}
          VARIANT: ${{ inputs.variant }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          try:
              expected = len(json.loads(os.environ["EXPECTED_SLOTS_JSON"]))
          except Exception:
              expected = 0

          rows = []
          for path in sorted(Path("safe-verdicts").glob("verdict-*.json")):
              try:
                  rows.append(json.loads(path.read_text(encoding="utf-8")))
              except Exception:
                  pass

          counts = Counter(str(row.get("category") or "missing") for row in rows)
          missing = max(0, expected - len(rows))
          post_proof_rechallenge = counts["post_proof_rechallenge"]
          technical = (
              counts["technical_failure"]
              + post_proof_rechallenge
              + counts["missing"]
              + missing
          )
          strict = counts["strict_success"]
          technical_pass_ip_blocked = counts["technical_pass_ip_blocked"]
          checkpoint = strict + technical_pass_ip_blocked
          ip_limited = counts["ip_riskblock"] + counts["ip_skipped"] + technical_pass_ip_blocked

          variant = os.environ.get("VARIANT", "")
          profile_state_ab = None
          webgl_integrity_ab = None
          hardware_template_ab = None
          fresh_completion_ab = None
          fresh_cookie_ab = None
          if variant == "sunbrowser_profile_state_ab_v1":
              expected_arms = {"prewarmed_treatment", "pristine_control"}
              arm_counts = Counter(
                  str(row.get("sunbrowser_profile_state_arm") or "missing")
                  for row in rows
              )
              assignment_ranks = [
                  row.get("sunbrowser_profile_state_assignment_rank") for row in rows
              ]
              assignment_totals = {
                  row.get("sunbrowser_profile_state_assignment_total") for row in rows
              }
              assignment_seeds = {
                  row.get("sunbrowser_profile_state_assignment_seed_sha256_12")
                  for row in rows
              }
              setup_valid = sum(
                  row.get("sunbrowser_profile_state_policy")
                  == "neutral_microsoft_state_ab_v2_balanced_hash"
                  and row.get("sunbrowser_profile_state_arm") in expected_arms
                  and row.get("sunbrowser_profile_state_init_exit_code") == 0
                  and row.get("sunbrowser_profile_state_copy_exit_code") == 0
                  and row.get("sunbrowser_profile_state_prewarm_exit_code") == 0
                  and row.get("sunbrowser_profile_state_bundle_match") is True
                  and row.get("sunbrowser_profile_state_source_match") is True
                  and isinstance(row.get("sunbrowser_profile_state_cookie_count"), int)
                  and row.get("sunbrowser_profile_state_cookie_count") > 0
                  for row in rows
              )
              assignment_valid = (
                  expected > 0
                  and assignment_totals == {expected}
                  and len(assignment_seeds) == 1
                  and None not in assignment_seeds
                  and all(isinstance(rank, int) for rank in assignment_ranks)
                  and sorted(assignment_ranks) == list(range(1, expected + 1))
              )
              balanced = (
                  set(arm_counts) == expected_arms
                  and abs(
                      arm_counts["prewarmed_treatment"]
                      - arm_counts["pristine_control"]
                  ) <= 1
              )
              experiment_complete = (
                  missing == 0
                  and len(rows) == expected
                  and setup_valid == expected
                  and assignment_valid
                  and balanced
              )

              by_arm = {}
              for arm in sorted(expected_arms):
                  arm_rows = [
                      row for row in rows
                      if row.get("sunbrowser_profile_state_arm") == arm
                  ]
                  n = len(arm_rows)
                  by_arm[arm] = {
                      "n": n,
                      "strict_success": sum(row.get("strict_success") is True for row in arm_rows),
                      "accepted_result0": sum(row.get("accepted_result0") is True for row in arm_rows),
                      "explicit_riskblock": sum(row.get("explicit_riskblock") is True for row in arm_rows),
                      "collector_minus1": sum(row.get("reason") == "collector_minus1" for row in arm_rows),
                      "non_ip": sum(row.get("explicit_riskblock") is not True for row in arm_rows),
                      "reasons": dict(sorted(Counter(
                          str(row.get("reason") or "missing") for row in arm_rows
                      ).items())),
                  }
              profile_state_ab = {
                  "experiment_complete": experiment_complete,
                  "setup_valid": setup_valid,
                  "assignment_valid": assignment_valid,
                  "balanced": balanced,
                  "by_arm": by_arm,
              }
              conclusion = (
                  "profile_state_ab_complete"
                  if experiment_complete
                  else "profile_state_ab_invalid"
              )
              goal_met = experiment_complete
          elif variant == "sunbrowser_webgl_integrity_ab_v1":
              expected_arms = {"restart2_treatment", "observe_control"}
              arm_counts = Counter(
                  str(row.get("sunbrowser_webgl_arm") or "missing")
                  for row in rows
              )
              assignment_ranks = [
                  row.get("sunbrowser_webgl_assignment_rank") for row in rows
              ]
              assignment_totals = {
                  row.get("sunbrowser_webgl_assignment_total") for row in rows
              }
              assignment_seeds = {
                  row.get("sunbrowser_webgl_assignment_seed_sha256_12")
                  for row in rows
              }
              assignment_valid = (
                  expected > 0
                  and assignment_totals == {expected}
                  and len(assignment_seeds) == 1
                  and None not in assignment_seeds
                  and all(isinstance(rank, int) for rank in assignment_ranks)
                  and sorted(assignment_ranks) == list(range(1, expected + 1))
              )
              balanced = (
                  set(arm_counts) == expected_arms
                  and abs(
                      arm_counts["restart2_treatment"]
                      - arm_counts["observe_control"]
                  ) <= 1
              )

              def evidence_is_valid(row):
                  arm = row.get("sunbrowser_webgl_arm")
                  if (
                      row.get("sunbrowser_webgl_policy")
                      != "webgl_integrity_restart2_ab_v1_balanced_hash"
                      or arm not in expected_arms
                  ):
                      return False
                  expected_limit = 2 if arm == "restart2_treatment" else 0
                  if row.get("sunbrowser_webgl_restart_limit") != expected_limit:
                      return False
                  if row.get("category") == "ip_skipped":
                      return row.get("sunbrowser_webgl_preflight_attempt_count") == 0
                  attempts = row.get("sunbrowser_webgl_preflight_attempt_count")
                  restarts = row.get("sunbrowser_webgl_restart_count")
                  initial_failed = row.get("sunbrowser_webgl_initial_failed")
                  final_ok = row.get("sunbrowser_webgl_final_ok")
                  recovered = row.get("sunbrowser_webgl_recovered")
                  if (
                      not isinstance(attempts, int)
                      or not 1 <= attempts <= 3
                      or not isinstance(restarts, int)
                      or not isinstance(initial_failed, bool)
                      or not isinstance(final_ok, bool)
                      or not isinstance(recovered, bool)
                  ):
                      return False
                  if arm == "observe_control":
                      return attempts == 1 and restarts == 0 and not recovered
                  if not initial_failed:
                      return attempts == 1 and restarts == 0 and final_ok and not recovered
                  if final_ok:
                      return attempts in {2, 3} and restarts == attempts - 1 and recovered
                  return (
                      attempts == 3
                      and restarts == 2
                      and not recovered
                      and row.get("sunbrowser_webgl_setup_invalid") is True
                  )

              evidence_valid = sum(evidence_is_valid(row) for row in rows)
              experiment_complete = (
                  missing == 0
                  and len(rows) == expected
                  and assignment_valid
                  and balanced
                  and evidence_valid == expected
              )
              by_arm = {}
              for arm in sorted(expected_arms):
                  arm_rows = [
                      row for row in rows
                      if row.get("sunbrowser_webgl_arm") == arm
                  ]
                  live_rows = [
                      row for row in arm_rows if row.get("category") != "ip_skipped"
                  ]
                  by_arm[arm] = {
                      "n": len(arm_rows),
                      "ip_skipped": len(arm_rows) - len(live_rows),
                      "live": len(live_rows),
                      "initial_webgl_broken": sum(
                          row.get("sunbrowser_webgl_initial_failed") is True
