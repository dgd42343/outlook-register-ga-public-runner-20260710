name: CTF GA own IP pool probe

on:
  workflow_dispatch:
    inputs:
      node_slots_json:
        description: "JSON matrix labels; in proxy mode they select pool slots, in GA-own-IP mode each label starts a fresh runner"
        required: true
        default: "[1,2,3,4,5]"
      orchestration_id:
        description: "Optional public-safe batch correlation label used by the target Graph-healthy orchestrator"
        required: false
        default: ""
      ads_profile_policy:
        description: "Online ADS fingerprint selection: production round-robin, randomized top-index A/B, or all top-index treatment"
        required: true
        default: "round_robin"
        type: choice
        options:
          - round_robin
          - historical_top_ab_v1
          - historical_top_v1
      fresh_session_restart_policy:
        description: "Full new registration session after a production fresh-policy stop: off, randomized A/B, or all eligible slots"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - fresh_ab_v1
          - fresh_all_v1
      network_mode:
        description: "Use the fresh GA runner egress directly or route through the configured proxy pool"
        required: true
        default: "ga_own_ip"
        type: choice
        options:
          - ga_own_ip
          - proxy_pool
      variant:
        description: "Probe variant to run on each fresh GA egress IP"
        required: true
        default: "offline_ads_pool_balanced_shuffle_v1"
        type: choice
        options:
          - default
          - historical_ga_success_default
          - historical_ga_highrate_336a973
          - historical_ga_fresh_rechallenge
          - online_ads_ga_fresh_rechallenge
          - online_ads_ga_production_fast_fail
          - online_ads_ga_fresh_5s_recovery
          - online_ads_ga_5s_hold_transplant
          - offline_ads_like_ga_fresh_rechallenge
          - offline_ads_pool_ga_fresh_rechallenge
          - offline_ads_pool_balanced_shuffle_v1
          - offline_ads_pool_diverse_proof_v1
          - offline_ads_pool_rechallenge_gate_v1
          - offline_ads_pool_rechallenge_gate_v2
          - offline_ads_pool_fresh_cookie_ab_v1
          - semiprotocol_5s_stable
          - sunbrowser_thin_natural
          - sunbrowser_thin_natural_alias_v284a
          - sunbrowser_thin_natural_raw_v284a
          - sunbrowser_thin_natural_envelope_v284a
          - sunbrowser_profile_state_ab_v1
          - sunbrowser_webgl_integrity_ab_v1
          - sunbrowser_hardware_template_ab_v1
          - sunbrowser_fresh_completion_ab_v1
          - semiprotocol_5s_historical_firstpass
          - semiprotocol_5s_histfp_no_inject_knp
          - release_5s_success_baseline
          - release_5s_success_attempt2
          - paired_5s_then_thin
          - paired_thin_then_5s
          - natural_legacy
          - ui_natural
      runner:
        description: "Ubuntu runner label for the GA egress pool"
        required: true
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
      timeout_minutes:
        description: "Per-job timeout minutes"
        required: true
        default: "30"
      probe_timeout_minutes:
        description: "Live probe timeout inside each job; timed-out bad IPs still upload evidence"
        required: true
        default: "18"
      fresh_absolute_timeout_seconds:
        description: "Hard deadline in seconds from the first accepted result|0 across all fresh-rechallenge attempts and rounds; 0 disables"
        required: true
        default: "60"
      per_ip_max_registrations:
        description: "Repeat successful registrations on the same GA egress IP until first non-success, capped here. Use 1 for legacy one-shot probing."
        required: true
        default: "1"
      egress_prefix_denylist:
        description: "Optional comma-separated bad egress IP prefixes to skip before touching the target, e.g. 20.,52. Recommended file: config/egress_prefix_denylist.recommended.txt. Over-provision candidates (e.g. 1..36) when denylist is non-empty so skipped IPs do not starve live count."
        required: false
        default: "4.,13.,20.,40.,52.,68.,74.249."
      pre_first_hold_warmup_ms:
        description: "Override captcha pre-first-hold warmup in ms; empty uses config default"
        required: false
        default: ""
      pre_first_hold_warmup_policy:
        description: "Captcha warmup policy: fixed input/default, blocked 14s-vs-22s A/B, or one explicit arm"
        required: true
        default: fixed_input
        type: choice
        options:
          - fixed_input
          - warmup_ab_14s_22s_v1
          - warmup_14s_v1
          - warmup_22s_v1
      signup_country_policy:
        description: "Protocol/CreateAccount country: source default, blocked US-vs-LK A/B, or one explicit arm"
        required: true
        default: source_default
        type: choice
        options:
          - source_default
          - country_ab_us_lk_v1
          - country_us_v1
          - country_lk_v1
      signup_dob_policy:
        description: "Signup DOB month/day: source default Jan-1, blocked random-vs-default A/B, or one explicit arm"
        required: true
        default: source_default
        type: choice
        options:
          - source_default
          - dob_ab_random_default_v1
          - dob_random_v1
          - dob_default_v1
      email_domain_policy:
        description: "Mailbox namespace: source default Outlook, blocked Hotmail-vs-Outlook A/B, or one explicit arm"
        required: true
        default: source_default
        type: choice
        options:
          - source_default
          - domain_ab_hotmail_outlook_v1
          - domain_hotmail_v1
          - domain_outlook_v1
      slot_stagger_seconds:
        description: "Stagger only probe-bound slots after denylist: delay=((attempt-1)%max_parallel)*seconds. Use 10-15 for speed, 30 for max isolation, 0 for concurrent."
        required: true
        default: "12"
      coordinator_mode:
        description: "Coordinator policy after denylist. final_only keeps retries on one egress spaced while distinct runner egresses remain concurrent."
        required: true
        default: "final_only"
        type: choice
        options:
          - "off"
          - entry
          - entry_final
          - final_only
      max_parallel:
        description: "Maximum simultaneous matrix jobs per repository; 20 is the verified starting point for a lane-aware final scheduler."
        required: true
        default: "20"
      runtime_mode:
        description: "Runtime bootstrap: legacy installs apt/pip per live slot; prebuilt restores the validated dependency/font/browser cache."
        required: true
        default: "prebuilt"
        type: choice
        options:
          - legacy
          - prebuilt
      runtime_cache_revision:
        description: "Prebuilt cache revision created by build-ga-runtime-cache.yml. Bump when Python, browser, or fonts change."
        required: true
        default: "v1"
      stop_on_rechallenge:
        description: "Override historical wrapper to stop stale proof fallback when risk/verify requests a fresh HumanCaptcha"
        required: true
        default: "0"
      primary_final_variant:
        description: "Optional retry candidate promoted before the first real collector fetch"
        required: false
        default: ""
      proxy_pool_file:
        description: "Optional checked-in private-source mihomo YAML. If empty, the optional CTF_PROXY_SUBSCRIPTION_URL Actions Secret is used."
        required: false
        default: ""
permissions:
  contents: read

jobs:
  own-ip-probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        attempt: ${{ fromJSON(inputs.node_slots_json) }}
    env:
      PYTHONIOENCODING: utf-8
      CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"
      CTF_PROXY_SUBSCRIPTION_URL: ${{ secrets.CTF_PROXY_SUBSCRIPTION_URL }}
      ADS_PROFILE_API_URL: ${{ secrets.ADS_PROFILE_API_URL }}
      RESULTS_ENCRYPTION_CERT_B64: ${{ vars.RESULTS_ENCRYPTION_CERT_B64 }}
      OUTLOOK_REAL_FINAL_PRIMARY_VARIANT: ${{ inputs.primary_final_variant }}
      GA_COORDINATOR_URL: ${{ vars.GA_COORDINATOR_URL }}
      GA_COORDINATOR_TOKEN: ${{ secrets.GA_COORDINATOR_TOKEN }}
      GA_COORDINATOR_MODE: ${{ inputs.coordinator_mode }}
      GA_COORDINATOR_SLOT: ${{ matrix.attempt }}
      GA_COORDINATOR_LANE: ${{ startsWith(inputs.orchestration_id, 'lane-ab-') && inputs.orchestration_id || github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ inputs.variant == 'offline_ads_pool_balanced_shuffle_v1' && '502635b8402912f98edbab9cad1a6fca2311be4a' || inputs.variant == 'offline_ads_pool_diverse_proof_v1' && '86d8756920dd85cecbdaf75f9e6bc99cc7d513e5' || (inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' || inputs.variant == 'offline_ads_pool_rechallenge_gate_v2') && 'a2053dbd2c83e6724145fca21fb0fbbdd09822b2' || inputs.variant == 'offline_ads_pool_fresh_cookie_ab_v1' && 'c183e15554378a23b0a79e38eeeffb5173fa9a3a' || inputs.variant == 'sunbrowser_fresh_completion_ab_v1' && '8416afe01af20fdc9311441624f01a32f0c99684' || inputs.variant == 'sunbrowser_hardware_template_ab_v1' && '63d36038928a364d4263049dd1a9a184e4552409' || inputs.variant == 'sunbrowser_webgl_integrity_ab_v1' && '64b9ca34ee7ce95407a22cf7e6c36562185eb077' || inputs.variant == 'sunbrowser_profile_state_ab_v1' && '73d4cffbbb31322f254903cb83890e4179a4b589' || inputs.variant == 'sunbrowser_thin_natural_envelope_v284a' && '77ed97ba2e15e4bf107e88a2e8c7a88e0aadef40' || inputs.variant == 'sunbrowser_thin_natural_raw_v284a' && '31e5d63efa879f753a71e0ac820c2bedfad376a1' || inputs.variant == 'sunbrowser_thin_natural_alias_v284a' && '2df4a7f25cd9c971b5ffba81174f7889432a2e77' || inputs.variant == 'sunbrowser_thin_natural' && '0f7a8643cf2ec6232f797e041f0cd79427bf38b9' || inputs.variant == 'historical_ga_success_default' && 'f8c9c0ea377a08b4c5c10a05c0558cda85d5a01a' || inputs.variant == 'historical_ga_highrate_336a973' && '336a97312e3e89219ad6179b196bfa99239cb13e' || inputs.variant == 'historical_ga_fresh_rechallenge' && '96787a7561f5e4b8786c2fda9cf3f8f1da0035bf' || inputs.variant == 'online_ads_ga_fresh_rechallenge' && '31dfe0e28e5da13645a455dba6737c19346faf63' || inputs.variant == 'online_ads_ga_production_fast_fail' && '875b0571d5b9c88b89a5bbc64f30488ee9565962' || inputs.variant == 'online_ads_ga_fresh_5s_recovery' && 'ae0745a95f73bec3ab24b9a5ce461bae1fa4a371' || inputs.variant == 'online_ads_ga_5s_hold_transplant' && '01086ae6d319a8bbf019ddb34267edd59ac7ec31' || (inputs.variant == 'release_5s_success_baseline' || inputs.variant == 'release_5s_success_attempt2') && '00b68437e041cbdcee2be209a18d7a5592f4c2dd' || (inputs.variant == 'offline_ads_like_ga_fresh_rechallenge' || inputs.variant == 'offline_ads_pool_ga_fresh_rechallenge') && '0838ef3a52c6eb337b0847762757d282b36b9e5e' || vars.PRIVATE_SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          clean: true

      - name: Verify historical GA success baseline
        if: ${{ inputs.variant == 'historical_ga_success_default' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=f8c9c0ea377a08b4c5c10a05c0558cda85d5a01a
          actual=$(git rev-parse HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          requirements = {
              line.strip() for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
          }
          assert "cloakbrowser==0.4.8" in requirements, sorted(requirements)
          assert Path("run_xvfb_natural_1920.sh").is_file()
          PY
          echo "historical_ga_success_source=$actual"

      - name: Verify historical high-rate GA baseline
        if: ${{ inputs.variant == 'historical_ga_highrate_336a973' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=336a973
          actual=$(git rev-parse --short=7 HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          grep -Fxq 'cloakbrowser==0.4.8' requirements.txt
          test -f run_xvfb_natural_1920.sh
          echo "historical_ga_highrate_source=$(git rev-parse HEAD)"

      - name: Verify fresh rechallenge source
        if: ${{ inputs.variant == 'historical_ga_fresh_rechallenge' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=96787a7561f5e4b8786c2fda9cf3f8f1da0035bf
          actual=$(git rev-parse HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          requirements = {line.strip() for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()}
          assert "cloakbrowser==0.4.8" in requirements
          controller = Path("controllers/base_controller.py").read_text(encoding="utf-8")
          wrapper = Path("run_xvfb_natural_1920.sh").read_text(encoding="utf-8")
          config = Path("config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json").read_text(encoding="utf-8")
          assert "fresh_rechallenge_start" in controller
          assert "OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_STOP_ON_RECHALLENGE=1" in wrapper
          assert '"hold_retries": 3' in config
          PY

      - name: Verify online ADS source
        if: ${{ inputs.variant == 'online_ads_ga_fresh_rechallenge' || inputs.variant == 'online_ads_ga_production_fast_fail' || inputs.variant == 'online_ads_ga_fresh_5s_recovery' || inputs.variant == 'online_ads_ga_5s_hold_transplant' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = "online_ads_ga_production_fast_fail" ]; then
            expected=875b0571d5b9c88b89a5bbc64f30488ee9565962
          elif [ "${{ inputs.variant }}" = "online_ads_ga_fresh_5s_recovery" ]; then
            expected=ae0745a95f73bec3ab24b9a5ce461bae1fa4a371
          elif [ "${{ inputs.variant }}" = "online_ads_ga_5s_hold_transplant" ]; then
            expected=01086ae6d319a8bbf019ddb34267edd59ac7ec31
          else
            expected=31dfe0e28e5da13645a455dba6737c19346faf63
          fi
          actual=$(git rev-parse HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          test -f tools/fetch_ads_profile_template.py
          test -f ads_like_cloak_profile_generator.py
          grep -q '_wait_for_ga_coordinator' controllers/patchright_controller.py
          grep -q 'minimal_natural_hold' protocol_runtime_probe.py
          grep -q -- '--final-proof-normalizer minimal_natural_hold' run_xvfb_natural_1920.sh
          if [ "${{ inputs.variant }}" = "online_ads_ga_production_fast_fail" ]; then
            grep -q 'fresh_rechallenge_policy_skip' controllers/base_controller.py
            grep -q 'check_available_is_username_conflict' controllers/base_controller.py
            python3 - <<'PY'
          from controllers.base_controller import (
              check_available_is_username_conflict,
              parse_fresh_rechallenge_rounds,
          )
          assert parse_fresh_rechallenge_rounds("0") == 0
          assert parse_fresh_rechallenge_rounds("99") == 3
          assert check_available_is_username_conflict({"isAvailable": False})
          assert check_available_is_username_conflict({"error": {"code": 1220}})
          assert not check_available_is_username_conflict({"error": {"code": 500}})
          PY
          fi
          if [ "${{ inputs.variant }}" = "online_ads_ga_5s_hold_transplant" ]; then
            test -f run_xvfb_natural_5s_transplant_1920.sh
            grep -q -- '--time-warp-wall-ms 6500' run_xvfb_natural_5s_transplant_1920.sh
            grep -q -- '--final-proof-normalizer minimal_natural_hold' run_xvfb_natural_5s_transplant_1920.sh
            grep -q -- '--disable-synthetic-u0' run_xvfb_natural_5s_transplant_1920.sh
          fi
          if [ "${{ inputs.variant }}" = "online_ads_ga_fresh_5s_recovery" ]; then
            test -f run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--mode natural_then_time_warp_hold' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--defer-route-hook-until-proof' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--final-proof-normalizer minimal_natural_hold' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--fresh-final-proof-normalizer ads_safe' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--fresh-final-scalar-anchor xghm87_low_bzt' run_xvfb_natural_fresh_5s_1920.sh
            grep -q 'fresh final proof normalizer switched' protocol_runtime_probe.py
            grep -q 'fresh final scalar anchor switched' protocol_runtime_probe.py
            grep -q -- '--time-warp-install-mode early' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--time-warp-wall-ms 6500' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--normalize-px1200-timing on' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--align-px561-timing-from-px1200' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--inject-knp-sandbox-event' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--exact-knp-wait-ms 1600' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--exact-knp-fallback-grace-ms 1600' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--synthetic-u0-lead-ms 650' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--min-runtime-hook-ready-frames 6' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--min-knp-prestart-ok 5' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--require-chctx-runtime-ready' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--prehold-readiness-gate-ms 1800' run_xvfb_natural_fresh_5s_1920.sh
            grep -q -- '--wait-after-ms 45000' run_xvfb_natural_fresh_5s_1920.sh
            grep -q 'FRESH_RECHALLENGE_ROUNDS:-3' run_xvfb_natural_fresh_5s_1920.sh
            grep -q 'return fallback()' protocol_runtime_probe.py
            grep -q 'captcha phase=initial handler=natural' protocol_runtime_probe.py
            grep -q 'captcha phase=fresh handler=time_warp_hold' protocol_runtime_probe.py
            grep -q 'fresh runtime route hook armed before shell' protocol_runtime_probe.py
            grep -q 'fresh_rechallenge_prepare' controllers/base_controller.py
            python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          source = Path("protocol_runtime_probe.py").read_text(encoding="utf-8")
          parser_flags = set()
          for node in ast.walk(ast.parse(source)):
              if not (
                  isinstance(node, ast.Call)
                  and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "add_argument"
              ):
                  continue
              for arg in node.args:
                  if (
                      isinstance(arg, ast.Constant)
                      and isinstance(arg.value, str)
                      and arg.value.startswith("--")
                  ):
                      parser_flags.add(arg.value)

          wrapper = Path("run_xvfb_natural_fresh_5s_1920.sh").read_text(encoding="utf-8")
          wrapper_flags = set(re.findall(r"^\s+(--[a-z0-9-]+)(?:\s|\\)", wrapper, re.MULTILINE))
          unknown = sorted(wrapper_flags - parser_flags)
          assert not unknown, f"unknown protocol_runtime_probe flags: {unknown}"
          print({"wrapper_flags": len(wrapper_flags), "unknown": unknown})
          PY
          fi
          grep -q 'FRESH_RECHALLENGE_ROUNDS' controllers/base_controller.py
          grep -q 'fresh_rechallenge_hold_budget' controllers/base_controller.py
          grep -q 'FRESH_BARE_SENSOR' controllers/base_controller.py
          grep -q 'FRESH_ABSOLUTE_TIMEOUT_SECONDS' controllers/base_controller.py
          grep -q 'FreshRechallengeAbsoluteDeadline' controllers/base_controller.py
          grep -q 'fresh_rechallenge_absolute_timeout' controllers/base_controller.py
          grep -q 'AbortController' controllers/base_controller.py
          grep -q 'fresh_absolute_deadline.remaining_ms' controllers/base_controller.py
          grep -q '_protocol_takeover_fresh_timeout_check' controllers/patchright_controller.py
          test -f controllers/fresh_rechallenge_watchdog.py
          test -f tests/test_fresh_rechallenge_watchdog.py
          python3 -m unittest tests.test_fresh_rechallenge_watchdog
          test -n "${ADS_PROFILE_API_URL:-}"
          # Fresh-rechallenge isolation contract from P0 slot13 vs result0_rechallenge diffs.
          # Grep the file directly. "echo "$huge" | grep -q" under pipefail can
          # fail with Broken pipe when grep exits early after a match.
          grep -q 'fresh_rechallenge_isolation_reset' controllers/base_controller.py
          grep -q 'synthetic_pt_markers' controllers/base_controller.py
          if grep -q 'pt_round=2&pt_ts=' controllers/base_controller.py; then
            echo "unexpected synthetic pt_round/pt_ts append still present" >&2
            exit 1
          fi

      - name: Verify exact 5s release source
        if: ${{ inputs.variant == 'release_5s_success_baseline' || inputs.variant == 'release_5s_success_attempt2' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=00b68437e041cbdcee2be209a18d7a5592f4c2dd
          actual=$(git rev-parse HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          test -f config.release-5s-success-ga.json
          test -f run_xvfb_release_5s_success_baseline.sh
          test -f run_xvfb_release_5s_success_attempt2.sh
          grep -q -- '--time-warp-wall-ms 6500' run_xvfb_release_5s_success_attempt2.sh
          grep -q -- '--time-warp-server-challenge-rounds 8' run_xvfb_release_5s_success_attempt2.sh
          grep -q -- '--time-warp-retry-visible-challenge-after-ms 7000' run_xvfb_release_5s_success_attempt2.sh
          grep -q -- '--real-final-neutral-w0-success' run_xvfb_release_5s_success_attempt2.sh

      - name: Verify offline ADS-like source
        if: ${{ inputs.variant == 'offline_ads_like_ga_fresh_rechallenge' }}
        shell: bash
        run: |
          set -euo pipefail
          expected=0838ef3a52c6eb337b0847762757d282b36b9e5e
          actual=$(git rev-parse HEAD)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ua = str((data.get('context') or {}).get('user_agent') or '')
          args = [str(x) for x in ((data.get('cloakbrowser') or {}).get('args') or [])]
          ads = data.get('ads_like_profile') or {}
          assert 'Chrome/146.0.7680.177' in ua, ua
          assert '--no-sandbox' not in args, args
          assert any(x.startswith('--fingerprint=') for x in args), args
          assert str(ads.get('seed') or '') == '96290', ads
          print(json.dumps({'ua': ua, 'cloak_args': args, 'ads_source': ads.get('source'), 'seed': ads.get('seed')}, ensure_ascii=False))
          PY
          grep -q '_wait_for_ga_coordinator' controllers/patchright_controller.py
          grep -q 'minimal_natural_hold' protocol_runtime_probe.py
          grep -q 'FRESH_RECHALLENGE_ROUNDS' controllers/base_controller.py

      - name: Verify offline ADS profile pool source
        if: ${{ inputs.variant == 'offline_ads_pool_ga_fresh_rechallenge' || inputs.variant == 'offline_ads_pool_balanced_shuffle_v1' || inputs.variant == 'offline_ads_pool_fresh_cookie_ab_v1' || inputs.variant == 'offline_ads_pool_diverse_proof_v1' || inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' || inputs.variant == 'offline_ads_pool_rechallenge_gate_v2' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = "offline_ads_pool_diverse_proof_v1" ]; then
            expected=86d8756920dd85cecbdaf75f9e6bc99cc7d513e5
          elif [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v2" ]; then
            expected=a2053dbd2c83e6724145fca21fb0fbbdd09822b2
          elif [ "${{ inputs.variant }}" = "offline_ads_pool_balanced_shuffle_v1" ]; then
            expected=502635b8402912f98edbab9cad1a6fca2311be4a
          elif [ "${{ inputs.variant }}" = "offline_ads_pool_fresh_cookie_ab_v1" ]; then
            expected=c183e15554378a23b0a79e38eeeffb5173fa9a3a
          else
            expected=0838ef3a52c6eb337b0847762757d282b36b9e5e
          fi
          actual=$(git rev-parse HEAD)
          test "$actual" = "$expected"
          test -f config.ads_offline_profile_pool.json
          test -f tools/fetch_ads_profile_template.py
          python3 - <<'PY'
          import json
          data = json.load(open('config.ads_offline_profile_pool.json', encoding='utf-8'))
          assert len(data.get('profiles') or []) >= 20
          text = json.dumps(data, ensure_ascii=False).lower()
          for forbidden in ('cookie', 'password', 'user_proxy_config', 'proxy_password', 'login_cookie'):
              assert forbidden not in text, forbidden
          print({'offline_profile_count': len(data['profiles'])})
          PY
          grep -q '_wait_for_ga_coordinator' controllers/patchright_controller.py
          grep -q 'minimal_natural_hold' protocol_runtime_probe.py
          if [ "${{ inputs.variant }}" = "offline_ads_pool_fresh_cookie_ab_v1" ]; then
            grep -q 'FRESH_CLEAR_SOLUTION_COOKIES' controllers/base_controller.py
            grep -q 'solution_cookie_policy' controllers/base_controller.py
          fi
          if [ "${{ inputs.variant }}" = "offline_ads_pool_balanced_shuffle_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_diverse_proof_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v2" ]; then
            grep -q 'select_profile_index' tools/fetch_ads_profile_template.py
            python3 -m unittest tools.test_fetch_ads_profile_template
          fi

      # Capture egress + denylist BEFORE heavy setup/stagger so bad prefixes exit in ~1 min.
      - name: Capture GA egress
        id: egress
        shell: bash
        env:
          EGRESS_PREFIX_DENYLIST: ${{ inputs.egress_prefix_denylist }}
        run: |
          set -euxo pipefail
          mkdir -p Results/diagnostics
          ip="$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || true)"
          export GA_PUBLIC_IP="$ip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          data = {
              "attempt": ${{ matrix.attempt }},
              "variant": "${{ inputs.variant }}",
              "network_mode": "${{ inputs.network_mode }}",
              "runner": "${{ inputs.runner }}",
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}",
              "public_ip": os.environ.get("GA_PUBLIC_IP", ""),
              "egress_prefix_denylist": os.environ.get("EGRESS_PREFIX_DENYLIST", ""),
          }
          with open("Results/diagnostics/ga_egress.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False))

          # The target sees egress/session identity, not the GitHub owner. Keep
          # retries from one runner in a lane while allowing distinct runner
          # egresses, including those supplied by other owners, to run in
          # parallel. Explicit lane-ab markers remain available for A/B tests.
          lane_source = os.environ.get("GA_COORDINATOR_LANE", "").strip()
          if not lane_source.startswith("lane-ab-") and data["public_ip"]:
              lane_source = "egress-v1:" + hashlib.sha256(
                  data["public_ip"].encode("utf-8")
              ).hexdigest()[:20]
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"GA_PUBLIC_IP={data['public_ip']}\n")
                  f.write(f"GA_COORDINATOR_LANE={lane_source or 'global'}\n")
          print(json.dumps({
              "coordinator_lane_basis": (
                  "egress" if data["public_ip"] else "owner_fallback"
              )
          }))

          ip = data.get("public_ip") or ""
          raw = os.environ.get("EGRESS_PREFIX_DENYLIST", "")
          prefixes = [p.strip() for p in raw.split(",") if p.strip()]
          matched = ""
          for prefix in prefixes:
              token = prefix
              if re.fullmatch(r"\d{1,3}", token):
                  token += "."
              if ip == token.rstrip(".") or ip.startswith(token):
                  matched = prefix
                  break
          github_output = os.environ.get("GITHUB_OUTPUT")
          if matched:
              reason = f"egress_prefix_denylist matched prefix={matched} ip={ip}"
              with open("Results/diagnostics/egress_skip.txt", "w", encoding="utf-8") as f:
                  f.write(reason + "\n")
              print(reason)
              if github_output:
                  with open(github_output, "a", encoding="utf-8") as f:
                      f.write("should_probe=false\n")
                      f.write(f"skip_reason={reason}\n")
          elif github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("should_probe=true\n")
          PY

      - name: Restore precompiled GA runtime
        if: ${{ steps.egress.outputs.should_probe != 'false' && inputs.runtime_mode == 'prebuilt' }}
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .venv
            ~/.cloakbrowser
            ~/.local/share/fonts/ga-runtime
          key: ${{ runner.os }}-${{ runner.arch }}-ga-runtime-${{ inputs.runtime_cache_revision }}-${{ inputs.runner == 'ubuntu-24.04' && 'py312' || 'py310' }}-cloak048
          fail-on-cache-miss: true

      - name: Validate precompiled GA runtime
        if: ${{ steps.egress.outputs.should_probe != 'false' && inputs.runtime_mode == 'prebuilt' }}
        shell: bash
        run: |
          set -euxo pipefail
          . .venv/bin/activate
          python - <<'PY'
          import importlib.metadata as md
          expected = {
              'cloakbrowser': '0.4.8',
              'playwright': '1.53.0',
              'patchright': '1.61.2',
          }
          for package, wanted in expected.items():
              actual = md.version(package)
              print(f'{package}={actual}')
              if actual != wanted:
                  raise SystemExit(f'{package}: expected {wanted}, got {actual}')
          PY
          chrome=$(ls -1d "$HOME"/.cloakbrowser/chromium-*/chrome 2>/dev/null | tail -1)
          test -x "$chrome"
          "$chrome" --version
          test -d "$HOME/.local/share/fonts/ga-runtime"
          fc-cache -f "$HOME/.local/share/fonts/ga-runtime"
          fc-match 'Segoe UI' | head -1
          fc-match 'Calibri' | head -1

      - name: Install pinned SunBrowser LocalFP runtime
        if: ${{ steps.egress.outputs.should_probe != 'false' && (inputs.variant == 'sunbrowser_thin_natural' || inputs.variant == 'sunbrowser_thin_natural_alias_v284a' || inputs.variant == 'sunbrowser_thin_natural_raw_v284a' || inputs.variant == 'sunbrowser_thin_natural_envelope_v284a' || inputs.variant == 'sunbrowser_profile_state_ab_v1' || inputs.variant == 'sunbrowser_webgl_integrity_ab_v1' || inputs.variant == 'sunbrowser_hardware_template_ab_v1' || inputs.variant == 'sunbrowser_fresh_completion_ab_v1') }}
        shell: bash
        env:
          NETWORK_MODE_INPUT: ${{ inputs.network_mode }}
        run: |
          set -euxo pipefail
          if [ "$NETWORK_MODE_INPUT" != "ga_own_ip" ]; then
            echo "SunBrowser public-runner v1 requires network_mode=ga_own_ip so region can fail closed to us" >&2
            exit 2
          fi
          SUNBROWSER_REGION_INPUT=us
          asset="SunBrowser-LocalFP-Linux-x64-20260718.tar.gz"
          expected="d1f881602e4e07c873154f3acd745b8772739c5f7469721c39eef0741b96235a"
          url="https://github.com/post7794/outlook-register-ga-public-runner-20260710/releases/download/sunbrowser-localfp-20260718/$asset"
          archive_dir="$RUNNER_TEMP/sunbrowser-localfp-archive"
          install_dir="$RUNNER_TEMP/sunbrowser-localfp"
          mkdir -p "$archive_dir" "$install_dir" Results/diagnostics
          curl -fsSL --retry 4 --retry-all-errors "$url" -o "$archive_dir/$asset"
          echo "$expected  $archive_dir/$asset" | sha256sum -c -
          tar -xzf "$archive_dir/$asset" -C "$install_dir"
          root="$install_dir/SunBrowser-LocalFP-Linux-x64-20260718"
          test -f "$root/MANIFEST.sha256"
          if ! (cd "$root" && sha256sum -c MANIFEST.sha256) > Results/diagnostics/sunbrowser-manifest.log 2>&1; then
            tail -80 Results/diagnostics/sunbrowser-manifest.log
            exit 1
          fi
          chmod +x "$root/tools/node" "$root/runtime/SunBrowser" "$root/runtime/chrome-sandbox"
          echo "SUNBROWSER_LOCALFP_ROOT=$root" >> "$GITHUB_ENV"
          echo "SUNBROWSER_REGION=$SUNBROWSER_REGION_INPUT" >> "$GITHUB_ENV"
          "$root/runtime/SunBrowser" --protected-disable-safe-open --version
          echo "SunBrowser package archive and manifest: PASS"

      - name: System dependencies
        if: ${{ steps.egress.outputs.should_probe != 'false' && inputs.runtime_mode == 'legacy' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth ca-certificates curl unzip fontconfig software-properties-common \
            fonts-liberation fonts-noto fonts-noto-cjk fonts-crosextra-carlito fonts-crosextra-caladea
          sudo apt-get install -y --no-install-recommends fonts-selawik || true
          sudo add-apt-repository -y multiverse || true
          sudo apt-get update || true
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections || true
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer || true
          fc-cache -f

      - name: Python environment
        if: ${{ steps.egress.outputs.should_probe != 'false' && inputs.runtime_mode == 'legacy' }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          if [ "${{ inputs.variant }}" != "sunbrowser_thin_natural" ] && [ "${{ inputs.variant }}" != "sunbrowser_thin_natural_alias_v284a" ] && [ "${{ inputs.variant }}" != "sunbrowser_thin_natural_raw_v284a" ] && [ "${{ inputs.variant }}" != "sunbrowser_thin_natural_envelope_v284a" ] && [ "${{ inputs.variant }}" != "sunbrowser_profile_state_ab_v1" ] && [ "${{ inputs.variant }}" != "sunbrowser_webgl_integrity_ab_v1" ] && [ "${{ inputs.variant }}" != "sunbrowser_hardware_template_ab_v1" ] && [ "${{ inputs.variant }}" != "sunbrowser_fresh_completion_ab_v1" ]; then
            set +e
            python -m cloakbrowser install
            cb_code=$?
            set -e
            if [ "$cb_code" -ne 0 ]; then
              echo "cloakbrowser install exited $cb_code; checking extracted binary"
              test -x "$(ls -1d "$HOME"/.cloakbrowser/chromium-*/chrome 2>/dev/null | tail -1)"
            fi
          else
            echo "SunBrowser variant selected; skipping CloakBrowser binary install"
          fi

      - name: Install Windows-like font family aliases
        if: ${{ steps.egress.outputs.should_probe != 'false' && inputs.runtime_mode == 'legacy' }}
        shell: bash
        run: |
          set -euxo pipefail
          . .venv/bin/activate
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path

          out = Path.home() / ".local/share/fonts/windows-ctf"
          out.mkdir(parents=True, exist_ok=True)

          def pick(*paths):
              return next((Path(p) for p in paths if Path(p).exists()), None)

          default_src = pick(
              '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
              '/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf',
              '/usr/share/fonts/truetype/msttcorefonts/Arial.ttf',
              '/usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf',
          )
          selawik_src = pick(
              '/usr/share/fonts/truetype/selawik/Selawik.ttf',
              '/usr/share/fonts/truetype/selawik/Selawik-Regular.ttf',
          ) or default_src
          calibri_src = pick(
              '/usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf',
              '/usr/share/fonts/truetype/msttcorefonts/Arial.ttf',
          ) or default_src
          msgothic_src = pick(
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc',
          ) or default_src
          if not default_src:
              raise SystemExit('no base font found')

          def set_name(font, name_id, value):
              font['name'].setName(value, name_id, 3, 1, 0x409)
              font['name'].setName(value, name_id, 1, 0, 0)

          families = [
              ('Segoe UI', 'Regular', selawik_src),
              ('Segoe UI Light', 'Regular', selawik_src),
              ('Calibri', 'Regular', calibri_src),
              ('Cambria', 'Regular', pick('/usr/share/fonts/truetype/crosextra/Caladea-Regular.ttf') or calibri_src),
              ('Marlett', 'Regular', default_src),
              ('MS UI Gothic', 'Regular', msgothic_src),
              ('Franklin Gothic', 'Regular', default_src),
          ]
          for family, subfamily, src in families:
              try:
                  font = TTFont(str(src))
              except Exception as exc:
                  if exc.__class__.__name__ == 'TTLibFileIsCollectionError':
                      font = TTFont(str(src), fontNumber=0)
                  else:
                      raise
              full = f'{family} {subfamily}'
              ps = ''.join(ch for ch in full if ch.isalnum())
              set_name(font, 1, family)
              set_name(font, 2, subfamily)
              set_name(font, 4, full)
              set_name(font, 6, ps)
              set_name(font, 16, family)
              set_name(font, 17, subfamily)
              font.save(str(out / f'{ps}.ttf'))
          PY
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match 'Segoe UI' | head -1
          fc-match 'Calibri' | head -1

      - name: Normalize shell scripts
        if: ${{ steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' run_xvfb_*.sh
          chmod +x run_xvfb_*.sh

      - name: Enable fresh HumanCaptcha rechallenge handling
        if: ${{ inputs.stop_on_rechallenge == '1' && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f run_xvfb_natural_1920.sh
          sed -i 's/OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_STOP_ON_RECHALLENGE=0/OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_STOP_ON_RECHALLENGE=1/' run_xvfb_natural_1920.sh
          grep -n 'OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_STOP_ON_RECHALLENGE=1' run_xvfb_natural_1920.sh

      - name: Select online ADS fingerprint arm
        id: ads_profile_select
        if: ${{ (inputs.variant == 'online_ads_ga_fresh_rechallenge' || inputs.variant == 'online_ads_ga_production_fast_fail' || inputs.variant == 'online_ads_ga_fresh_5s_recovery' || inputs.variant == 'online_ads_ga_5s_hold_transplant') && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          ADS_PROFILE_POLICY: ${{ inputs.ads_profile_policy }}
          GA_MATRIX_SLOT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = os.environ["ADS_PROFILE_POLICY"]
          matrix_slot = int(os.environ["GA_MATRIX_SLOT"])
          top_source_slots = (1, 3, 6, 13)  # selected indices 0, 2, 5, 12
          non_top_source_slots = tuple(
              slot for slot in range(1, 36) if slot not in top_source_slots
          )
          if policy == "historical_top_ab_v1":
              if matrix_slot % 2:
                  arm = "top_v1"
                  rank = (matrix_slot - 1) // 2
                  source_slot = top_source_slots[rank % len(top_source_slots)]
              else:
                  arm = "non_top_control"
                  rank = matrix_slot // 2 - 1
                  source_slot = non_top_source_slots[rank % len(non_top_source_slots)]
          elif policy == "historical_top_v1":
              arm = "top_v1"
              source_slot = top_source_slots[(matrix_slot - 1) % len(top_source_slots)]
          elif policy == "round_robin":
              arm = "round_robin"
              source_slot = matrix_slot
          else:
              raise SystemExit(f"unsupported ADS profile policy: {policy}")

          selection = {
              "policy": policy,
              "arm": arm,
              "matrix_slot": matrix_slot,
              "source_slot": source_slot,
              "expected_selected_index": source_slot - 1,
              "top_selected_indices": [0, 2, 5, 12],
          }
          Path("Results/diagnostics/ads_profile_selection.json").write_text(
              json.dumps(selection, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key in ("policy", "arm", "matrix_slot", "source_slot", "expected_selected_index"):
                  handle.write(f"{key}={selection[key]}\n")
          print(json.dumps(selection, ensure_ascii=False))
          PY

      - name: Fetch and apply online ADS fingerprint
        if: ${{ (inputs.variant == 'online_ads_ga_fresh_rechallenge' || inputs.variant == 'online_ads_ga_production_fast_fail' || inputs.variant == 'online_ads_ga_fresh_5s_recovery' || inputs.variant == 'online_ads_ga_5s_hold_transplant') && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ads-online/generated Results/diagnostics
          python3 tools/fetch_ads_profile_template.py \
            --api-base "$ADS_PROFILE_API_URL" \
            --slot "${{ steps.ads_profile_select.outputs.source_slot }}" \
            --out .ads-online/profile.json | tee Results/diagnostics/ads_online_fetch.json
          ADS_PROFILE_POLICY="${{ steps.ads_profile_select.outputs.policy }}" \
          ADS_PROFILE_ARM="${{ steps.ads_profile_select.outputs.arm }}" \
          GA_MATRIX_SLOT="${{ steps.ads_profile_select.outputs.matrix_slot }}" \
          ADS_PROFILE_SOURCE_SLOT="${{ steps.ads_profile_select.outputs.source_slot }}" \
          ADS_EXPECTED_SELECTED_INDEX="${{ steps.ads_profile_select.outputs.expected_selected_index }}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("Results/diagnostics/ads_online_fetch.json")
          row = json.loads(path.read_text(encoding="utf-8"))
          policy = os.environ["ADS_PROFILE_POLICY"]
          row.update({
              "selection_policy": policy,
              "selection_arm": os.environ["ADS_PROFILE_ARM"],
              "matrix_slot": int(os.environ["GA_MATRIX_SLOT"]),
              "profile_source_slot": int(os.environ["ADS_PROFILE_SOURCE_SLOT"]),
              "expected_selected_index": int(os.environ["ADS_EXPECTED_SELECTED_INDEX"]),
          })
          if policy != "round_robin":
              assert int(row.get("eligible_profile_count") or 0) == 35, row
              assert int(row.get("selected_index")) == row["expected_selected_index"], row
          path.write_text(json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "selection_policy": row["selection_policy"],
              "selection_arm": row["selection_arm"],
              "matrix_slot": row["matrix_slot"],
              "profile_source_slot": row["profile_source_slot"],
              "selected_index": row.get("selected_index"),
              "eligible_profile_count": row.get("eligible_profile_count"),
              "template_sha256": row.get("template_sha256"),
          }, ensure_ascii=False))
          PY
          python3 ads_like_cloak_profile_generator.py \
            --source-json .ads-online/profile.json \
            --base-config config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json \
            --out-dir .ads-online/generated \
            --profile-root ./profiles \
            --prefix "ga-ads-slot-${{ matrix.attempt }}" \
            --count 1 \
            --seed-mode derived \
            --window-size 1920,1080 \
            --hold-retries 3 \
            --chromium-version 146.0.7680.177
          generated=$(find .ads-online/generated -maxdepth 1 -type f -name 'config.ctf.runtime.*.json' ! -name '*manifest*' | head -n1)
          test -n "$generated"
          cp "$generated" config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          ua = str((data.get("context") or {}).get("user_agent") or "")
          args = [str(x) for x in ((data.get("cloakbrowser") or {}).get("args") or [])]
          assert "Chrome/146.0.7680.177" in ua, ua
          assert "--no-sandbox" not in args, args
          assert str((data.get("ads_like_profile") or {}).get("source")) == "offline AdsPower profile JSON"
          print(json.dumps({"ua": ua, "cloak_args": args, "seed": (data.get("ads_like_profile") or {}).get("seed")}, ensure_ascii=False))
          PY

      - name: Apply offline ADS profile-pool fingerprint
        if: ${{ (inputs.variant == 'offline_ads_pool_ga_fresh_rechallenge' || inputs.variant == 'offline_ads_pool_balanced_shuffle_v1' || inputs.variant == 'offline_ads_pool_fresh_cookie_ab_v1' || inputs.variant == 'offline_ads_pool_diverse_proof_v1' || inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' || inputs.variant == 'offline_ads_pool_rechallenge_gate_v2') && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          PROFILE_SELECTION_SEED: ${{ format('{0}:{1}', inputs.orchestration_id != '' && inputs.orchestration_id || github.run_id, startsWith(inputs.orchestration_id, 'lane-ab-') && inputs.orchestration_id || github.repository_owner) }}
        run: |
          set -euo pipefail
          mkdir -p .ads-offline/generated Results/diagnostics
          selection_args=()
          if [ "${{ inputs.variant }}" = "offline_ads_pool_balanced_shuffle_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_diverse_proof_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v1" ] || [ "${{ inputs.variant }}" = "offline_ads_pool_rechallenge_gate_v2" ]; then
            selection_args=(--selection-seed "$PROFILE_SELECTION_SEED")
          fi
          python3 tools/fetch_ads_profile_template.py \
            --offline-pool config.ads_offline_profile_pool.json \
            --slot "${{ matrix.attempt }}" \
            "${selection_args[@]}" \
            --out .ads-offline/profile.json | tee Results/diagnostics/ads_offline_select.json
          python3 ads_like_cloak_profile_generator.py \
            --source-json .ads-offline/profile.json \
            --base-config config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json \
            --out-dir .ads-offline/generated \
            --profile-root ./profiles \
            --prefix "ga-offline-ads-slot-${{ matrix.attempt }}" \
            --count 1 \
            --seed-mode derived \
            --window-size 1920,1080 \
            --hold-retries 3 \
            --chromium-version 146.0.7680.177
          generated=$(find .ads-offline/generated -maxdepth 1 -type f -name 'config.ctf.runtime.*.json' ! -name '*manifest*' | head -n1)
          test -n "$generated"
          cp "$generated" config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json
          python3 - <<'PY'
          import json
          p = 'config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json'
          data = json.load(open(p, encoding='utf-8'))
          ua = str((data.get('context') or {}).get('user_agent') or '')
          args = [str(x) for x in ((data.get('cloakbrowser') or {}).get('args') or [])]
          ads = data.get('ads_like_profile') or {}
          seeds = [x.split('=', 1)[1] for x in args if x.startswith('--fingerprint=')]
          assert 'Chrome/146.0.7680.177' in ua, ua
          assert '--no-sandbox' not in args, args
          assert len(seeds) == 1 and len(seeds[0]) == 5, seeds
          assert ads.get('source') == 'offline AdsPower profile JSON', ads
          print(json.dumps({'ua': ua, 'seed': seeds[0], 'source': ads.get('source')}, ensure_ascii=False))
          PY

      - name: Diversify exact-release Cloak fingerprint per fresh runner
        if: ${{ (inputs.variant == 'release_5s_success_baseline' || inputs.variant == 'release_5s_success_attempt2') && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          GA_SLOT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          path = Path("config.release-5s-success-ga.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          material = f"{os.environ.get('GITHUB_RUN_ID','')}:{os.environ['GA_SLOT']}"
          seed = 10000 + int(hashlib.sha256(material.encode()).hexdigest()[:8], 16) % 90000
          cloak = data.setdefault("cloakbrowser", {})
          args = [str(value) for value in (cloak.get("args") or [])]
          args = [value for value in args if not value.startswith("--fingerprint=")]
          args.insert(0, f"--fingerprint={seed}")
          cloak["args"] = args
          profile = data.setdefault("ads_like_profile", {})
          profile["seed"] = str(seed)
          profile["source"] = "GA per-run deterministic seed"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({"fingerprint_seed": seed, "slot": os.environ["GA_SLOT"]}))
          PY

      - name: Start subscription proxy
        if: ${{ inputs.network_mode == 'proxy_pool' && steps.egress.outputs.should_probe != 'false' && (env.CTF_PROXY_SUBSCRIPTION_URL != '' || inputs.proxy_pool_file != '') }}
        shell: bash
        env:
          PROXY_SUBSCRIPTION_URL: ${{ env.CTF_PROXY_SUBSCRIPTION_URL }}
          PROXY_POOL_FILE: ${{ inputs.proxy_pool_file }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics .mihomo-ga
          . .venv/bin/activate
          source_args=()
          if [ -n "$PROXY_SUBSCRIPTION_URL" ]; then
            source_args=(--url "$PROXY_SUBSCRIPTION_URL")
          else
            test -f "$PROXY_POOL_FILE"
            source_args=(--config "$PROXY_POOL_FILE")
          fi

          python tools/setup_ga_subscription_proxy.py \
            "${source_args[@]}" \
            --node-slot "${{ matrix.attempt }}" \
            --out-dir .mihomo-ga \
            --http-port 17890 \
            --socks-port 17891 \
            --controller-port 19090 | tee Results/diagnostics/proxy_select.txt

          # Pin the release asset used by the verified proxy runs. Querying the
          # GitHub releases API independently from 20 jobs can hit the unauthenticated
          # rate limit and drop a matrix slot before its live probe starts.
          asset_url="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.28/mihomo-linux-amd64-v1-v1.19.28.gz"
          echo "mihomo_asset=$asset_url" >> Results/diagnostics/proxy_select.txt
          curl -fsSL "$asset_url" -o .mihomo-ga/mihomo.gz
          gzip -dc .mihomo-ga/mihomo.gz > .mihomo-ga/mihomo
          chmod +x .mihomo-ga/mihomo
          nohup .mihomo-ga/mihomo -d .mihomo-ga -f .mihomo-ga/config.yaml > Results/diagnostics/mihomo.log 2>&1 &
          echo "$!" > Results/diagnostics/mihomo.pid
          sleep 2
          for i in $(seq 1 20); do
            if curl -fsS --max-time 8 -x http://127.0.0.1:17890 https://api.ipify.org > Results/diagnostics/proxy_public_ip.txt 2>>Results/diagnostics/proxy_curl.err; then
              break
            fi
            sleep 2
          done
          proxy_ip="$(cat Results/diagnostics/proxy_public_ip.txt 2>/dev/null || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          selected = {}
          try:
              selected = json.loads(Path(".mihomo-ga/selected_proxy.json").read_text(encoding="utf-8"))
          except Exception as exc:
              selected = {"selected_error": repr(exc)}
          proxy_ip = Path("Results/diagnostics/proxy_public_ip.txt").read_text(encoding="utf-8", errors="replace").strip() if Path("Results/diagnostics/proxy_public_ip.txt").exists() else ""
          selected["proxy_public_ip"] = proxy_ip
          selected["proxy_ready"] = bool(proxy_ip)
          Path("Results/diagnostics/ga_proxy_egress.json").write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({"proxy_ready": bool(proxy_ip), "proxy_public_ip": proxy_ip, "selected_index": selected.get("selected_index"), "selected_name": selected.get("selected_name")}, ensure_ascii=False))
          PY
          cat Results/diagnostics/ga_proxy_egress.json
          echo "OUTLOOK_PROXY_URL=http://127.0.0.1:17890" >> "$GITHUB_ENV"

      - name: Stagger live target entry
        if: ${{ inputs.coordinator_mode == 'off' && inputs.network_mode == 'ga_own_ip' && steps.egress.outputs.should_probe != 'false' && fromJSON(inputs.slot_stagger_seconds) > 0 }}
        shell: bash
        run: |
          set -euo pipefail
          # Wave stagger: only spread across max_parallel lanes so slot 36 does not
          # wait (35 * stagger) after denylist already discarded many candidates.
          attempt=${{ matrix.attempt }}
          max_p=${{ fromJSON(inputs.max_parallel) }}
          step=${{ fromJSON(inputs.slot_stagger_seconds) }}
          if [ "$max_p" -lt 1 ]; then max_p=1; fi
          wave=$(( (attempt - 1) % max_p ))
          delay=$(( wave * step ))
          echo "slot=$attempt wave=$wave max_parallel=$max_p stagger_seconds=$delay"
          sleep "$delay"

      - name: Record sanitized registration browser environment
        if: ${{ steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          GA_SLOT: ${{ matrix.attempt }}
          GA_VARIANT: ${{ inputs.variant }}
          GA_NETWORK_MODE: ${{ inputs.network_mode }}
          GA_PUBLIC_IP: ${{ env.GA_PUBLIC_IP }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python3 - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import subprocess
          from pathlib import Path

          release_variant = os.environ.get('GA_VARIANT', '').startswith('release_5s_success_')
          source = Path(
              'config.release-5s-success-ga.json'
              if release_variant else
              'config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json'
          )
          data = json.loads(source.read_text(encoding='utf-8'))
          context = dict(data.get('context') or {})
          cloak = dict(data.get('cloakbrowser') or {})
          manifest = {
              # This is intentionally a launchable, non-secret subset of the
              # exact config. It contains no profile directory, AdsPower ID,
              # cookie, proxy credential, or account identifier.
              'context': context,
              'cloakbrowser': cloak,
              'patchright': {'use_cloakbrowser': bool((data.get('patchright') or {}).get('use_cloakbrowser'))},
              'proxy': '',
              'recovery_provenance': {
                  'schema': 1,
                  'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'slot': os.environ.get('GA_SLOT', ''),
                  'variant': os.environ.get('GA_VARIANT', ''),
                  'network_mode': os.environ.get('GA_NETWORK_MODE', ''),
                  'xvfb_screen': '1920x1200x24' if release_variant else '2560x1440x24',
                  'cloakbrowser_version': importlib.metadata.version('cloakbrowser'),
                  'source_config_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                  # Keep egress comparable without persisting an address in
                  # the artifact; a proxy itself must be supplied separately.
                  'egress_sha256': hashlib.sha256(os.environ.get('GA_PUBLIC_IP', '').encode()).hexdigest(),
                  'proxy_was_configured': bool(data.get('proxy')) or bool(os.environ.get('OUTLOOK_PROXY_URL')),
              },
          }
          out = Path('Results/diagnostics/registration_browser_env.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          # Safe confirmation only; do not print headers, UA, fingerprints, or
          # any persistent-profile data into the public runner log.
          print(json.dumps({'recorded': True, 'schema': 1, 'proxy_was_configured': manifest['recovery_provenance']['proxy_was_configured']}))
          PY

      - name: Reserve globally coordinated live entry
        if: ${{ (inputs.coordinator_mode == 'entry' || inputs.coordinator_mode == 'entry_final') && inputs.network_mode == 'ga_own_ip' && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          GA_SLOT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          test -n "${GA_COORDINATOR_URL:-}"
          test -n "${GA_COORDINATOR_TOKEN:-}"
          mkdir -p Results/diagnostics
          payload=$(python3 - <<'PY'
          import hashlib, json, os
          lane_source = os.environ.get("GA_COORDINATOR_LANE", "").strip() or "global"
          lane = (
              "global" if lane_source == "global" else
              hashlib.sha256(
                  f"ga-coordinator-lane-v1\0{lane_source}".encode("utf-8")
              ).hexdigest()[:16]
          )
          print(json.dumps({
              "stage": "entry",
              "request_id": f"{os.environ['GITHUB_RUN_ID']}:{os.environ['GA_SLOT']}:entry",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "slot": os.environ["GA_SLOT"],
              "lane": lane,
          }, separators=(",", ":")))
          PY

          )
          response=$(curl -fsS --retry 4 --retry-all-errors --connect-timeout 8 --max-time 20 \
            -A 'github-actions-ga-coordinator/1.0' \
            -H "Authorization: Bearer ${GA_COORDINATOR_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${GA_COORDINATOR_URL%/}/v1/reservations")
          printf '%s\n' "$response" | tee Results/diagnostics/ga_coordinator_entry.json
          wait_ms=$(python3 -c 'import json,sys,time; print(max(0,int(json.load(sys.stdin)["scheduled_at_ms"])-int(time.time()*1000)))' <<<"$response")
          echo "coordinator_wait_ms=$wait_ms slot=$GA_SLOT"
          python3 -c 'import sys,time; time.sleep(max(0,int(sys.argv[1]))/1000)' "$wait_ms"

      - name: Prepare SunBrowser profile state A-B
        if: ${{ inputs.variant == 'sunbrowser_profile_state_ab_v1' && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          STATE_SLOT: ${{ matrix.attempt }}
          STATE_SLOTS_JSON: ${{ inputs.node_slots_json }}
          STATE_ASSIGNMENT_SEED: ${{ inputs.orchestration_id }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
        run: |
          set +e
          mkdir -p Results/diagnostics
          if [ "$PER_IP_MAX_REGISTRATIONS" -ne 1 ]; then
            echo "sunbrowser profile-state A/B requires per_ip_max_registrations=1" >&2
            exit 2
          fi
          profile_id="ga-state-${GITHUB_RUN_ID}-${STATE_SLOT}"
          base_state="profiles/sunbrowser-state-ab/base"
          warmed_state="profiles/sunbrowser-state-ab/warmed"
          init_provenance="Results/diagnostics/sunbrowser_state_init.provenance.safe.json"
          prewarm_provenance="Results/diagnostics/sunbrowser_state_prewarm.provenance.safe.json"
          registration_provenance="Results/diagnostics/sunbrowser_state_registration.provenance.safe.json"
          init_log="Results/diagnostics/sunbrowser_state_init.log"
          prewarm_log="Results/diagnostics/sunbrowser_state_prewarm.log"
          assignment=$(python3 - <<'PY'
          import hashlib
          import json
          import os

          slots = [str(item) for item in json.loads(os.environ["STATE_SLOTS_JSON"])]
          current = str(os.environ["STATE_SLOT"])
          seed = os.environ.get("STATE_ASSIGNMENT_SEED") or os.environ["GITHUB_RUN_ID"]
          ranked = sorted(
              slots,
              key=lambda slot: hashlib.sha256(f"{seed}:{slot}".encode()).digest(),
          )
          if current not in ranked:
              raise SystemExit(f"matrix slot {current!r} missing from STATE_SLOTS_JSON")
          rank = ranked.index(current) + 1
          treatment_count = (len(ranked) + 1) // 2
          arm = "prewarmed_treatment" if rank <= treatment_count else "pristine_control"
          seed_sha = hashlib.sha256(seed.encode()).hexdigest()[:12]
          print(f"{arm}\t{rank}\t{len(ranked)}\t{seed_sha}")
          PY
          )
          IFS=$'\t' read -r state_arm assignment_rank assignment_total assignment_seed_sha <<<"$assignment"
          if [ -z "$state_arm" ] || [ -z "$assignment_rank" ]; then
            echo "sunbrowser profile-state balanced assignment failed" >&2
            exit 2
          fi
          echo "[SUN_PROFILE_AB] prepare begin arm=$state_arm rank=$assignment_rank/$assignment_total seed_sha=$assignment_seed_sha"

          SUNBROWSER_PROFILE_ID="$profile_id" \
          SUNBROWSER_STATE_ROOT="$base_state" \
          SUNBROWSER_REUSE_EXISTING_PROFILE=0 \
          SUNBROWSER_PREWARM_MODE=local_only \
          SUNBROWSER_PROVENANCE_OUT="$init_provenance" \
            timeout --foreground 3m ./run_xvfb_sunbrowser_prewarm_1920.sh \
              >"$init_log" 2>&1
          init_ec=$?
          tail -30 "$init_log" || true

          copy_ec=""
          prewarm_ec=""
          if [ "$init_ec" -eq 0 ]; then
            mkdir -p "$warmed_state"
            cp -a "$base_state/." "$warmed_state/"
            copy_ec=$?
          fi
          if [ "$init_ec" -eq 0 ] && [ "$copy_ec" -eq 0 ]; then
            SUNBROWSER_PROFILE_ID="$profile_id" \
            SUNBROWSER_STATE_ROOT="$warmed_state" \
            SUNBROWSER_REUSE_EXISTING_PROFILE=1 \
            SUNBROWSER_PREWARM_MODE=neutral \
            SUNBROWSER_PREWARM_SETTLE_SECONDS=6 \
            SUNBROWSER_PROVENANCE_OUT="$prewarm_provenance" \
              timeout --foreground 4m ./run_xvfb_sunbrowser_prewarm_1920.sh \
                >"$prewarm_log" 2>&1
            prewarm_ec=$?
            tail -30 "$prewarm_log" || true
          fi

          setup_ok=false
          registration_root="$base_state"
          if [ "$state_arm" = "prewarmed_treatment" ]; then
            registration_root="$warmed_state"
          fi
          if [ "$init_ec" -eq 0 ] && [ "$copy_ec" -eq 0 ] && [ "$prewarm_ec" -eq 0 ]; then
            setup_ok=true
          else
            echo "sunbrowser_profile_state_setup_failure" \
              > Results/diagnostics/sunbrowser_profile_state_setup_failure.txt
          fi
          {
            echo "SUNBROWSER_PROFILE_ID=$profile_id"
            echo "SUNBROWSER_STATE_ROOT=$registration_root"
            echo "SUNBROWSER_REUSE_EXISTING_PROFILE=1"
            echo "SUNBROWSER_PROVENANCE_OUT=$registration_provenance"
            echo "SUNBROWSER_PROFILE_STATE_ARM=$state_arm"
            echo "SUNBROWSER_PROFILE_STATE_SETUP_OK=$setup_ok"
          } >> "$GITHUB_ENV"

          STATE_ARM="$state_arm" \
          ASSIGNMENT_RANK="$assignment_rank" \
          ASSIGNMENT_TOTAL="$assignment_total" \
          ASSIGNMENT_SEED_SHA="$assignment_seed_sha" \
          INIT_EC="$init_ec" \
          COPY_EC="$copy_ec" \
          PREWARM_EC="$prewarm_ec" \
          PREWARM_LOG="$prewarm_log" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def as_int(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          cookie_count = None
          log = Path(os.environ["PREWARM_LOG"])
          if log.is_file():
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      candidate = json.loads(line)
                  except Exception:
                      continue
                  if candidate.get("status") == "ok" and "microsoft_cookie_count" in candidate:
                      cookie_count = as_int(candidate.get("microsoft_cookie_count"))
          arm = os.environ["STATE_ARM"]
          row = {
              "policy": "neutral_microsoft_state_ab_v2_balanced_hash",
              "arm": arm,
              "assignment_rank": as_int(os.environ.get("ASSIGNMENT_RANK")),
              "assignment_total": as_int(os.environ.get("ASSIGNMENT_TOTAL")),
              "assignment_seed_sha256_12": os.environ.get("ASSIGNMENT_SEED_SHA"),
              "registration_uses_prewarmed_state": arm == "prewarmed_treatment",
              "init_exit_code": as_int(os.environ.get("INIT_EC")),
              "copy_exit_code": as_int(os.environ.get("COPY_EC")),
              "prewarm_exit_code": as_int(os.environ.get("PREWARM_EC")),
              "prewarm_microsoft_cookie_count": cookie_count,
          }
          Path("Results/diagnostics/sunbrowser_profile_state_ab.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          echo "[SUN_PROFILE_AB] prepare end arm=$state_arm init=$init_ec copy=${copy_ec:-na} prewarm=${prewarm_ec:-na} setup_ok=$setup_ok"

      - name: Prepare SunBrowser WebGL integrity A-B
        if: ${{ inputs.variant == 'sunbrowser_webgl_integrity_ab_v1' }}
        shell: bash
        env:
          WEBGL_SLOT: ${{ matrix.attempt }}
          WEBGL_SLOTS_JSON: ${{ inputs.node_slots_json }}
          WEBGL_ASSIGNMENT_SEED: ${{ inputs.orchestration_id }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics
          if [ "$PER_IP_MAX_REGISTRATIONS" -ne 1 ]; then
            echo "sunbrowser WebGL integrity A/B requires per_ip_max_registrations=1" >&2
            exit 2
          fi
          assignment=$(python3 - <<'PY'
          import hashlib
          import json
          import os

          slots = [str(item) for item in json.loads(os.environ["WEBGL_SLOTS_JSON"])]
          current = str(os.environ["WEBGL_SLOT"])
          seed = os.environ.get("WEBGL_ASSIGNMENT_SEED") or os.environ["GITHUB_RUN_ID"]
          ranked = sorted(
              slots,
              key=lambda slot: hashlib.sha256(f"{seed}:{slot}".encode()).digest(),
          )
          if current not in ranked:
              raise SystemExit(f"matrix slot {current!r} missing from WEBGL_SLOTS_JSON")
          rank = ranked.index(current) + 1
          treatment_count = (len(ranked) + 1) // 2
          arm = "restart2_treatment" if rank <= treatment_count else "observe_control"
          restart_limit = 2 if arm == "restart2_treatment" else 0
          seed_sha = hashlib.sha256(seed.encode()).hexdigest()[:12]
          print(f"{arm}\t{restart_limit}\t{rank}\t{len(ranked)}\t{seed_sha}")
          PY
          )
          IFS=$'\t' read -r webgl_arm restart_limit assignment_rank assignment_total assignment_seed_sha <<<"$assignment"
          test -n "$webgl_arm"
          test -n "$assignment_rank"
          provenance="Results/diagnostics/sunbrowser_webgl_registration.provenance.safe.json"
          {
            echo "SUNBROWSER_PROFILE_ID=ga-webgl-${GITHUB_RUN_ID}-${WEBGL_SLOT}"
            echo "SUNBROWSER_STATE_ROOT=profiles/sunbrowser-webgl-integrity-ab"
            echo "SUNBROWSER_PROVENANCE_OUT=$provenance"
            echo "SUNBROWSER_WEBGL_INTEGRITY_RESTARTS=$restart_limit"
          } >> "$GITHUB_ENV"
          WEBGL_ARM="$webgl_arm" \
          RESTART_LIMIT="$restart_limit" \
          ASSIGNMENT_RANK="$assignment_rank" \
          ASSIGNMENT_TOTAL="$assignment_total" \
          ASSIGNMENT_SEED_SHA="$assignment_seed_sha" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": "webgl_integrity_restart2_ab_v1_balanced_hash",
              "arm": os.environ["WEBGL_ARM"],
              "restart_limit": int(os.environ["RESTART_LIMIT"]),
              "assignment_rank": int(os.environ["ASSIGNMENT_RANK"]),
              "assignment_total": int(os.environ["ASSIGNMENT_TOTAL"]),
              "assignment_seed_sha256_12": os.environ["ASSIGNMENT_SEED_SHA"],
          }
          Path("Results/diagnostics/sunbrowser_webgl_integrity_ab.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          echo "[SUN_WEBGL_AB] arm=$webgl_arm restart_limit=$restart_limit rank=$assignment_rank/$assignment_total"

      - name: Prepare SunBrowser hardware template A-B
        if: ${{ inputs.variant == 'sunbrowser_hardware_template_ab_v1' }}
        shell: bash
        env:
          HW_SLOT: ${{ matrix.attempt }}
          HW_SLOTS_JSON: ${{ inputs.node_slots_json }}
          HW_ASSIGNMENT_SEED: ${{ inputs.orchestration_id }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics
          if [ "$PER_IP_MAX_REGISTRATIONS" -ne 1 ]; then
            echo "sunbrowser hardware template A/B requires per_ip_max_registrations=1" >&2
            exit 2
          fi
          assignment=$(python3 - <<'PY'
          import hashlib
          import json
          import os

          slots = [str(item) for item in json.loads(os.environ["HW_SLOTS_JSON"])]
          current = str(os.environ["HW_SLOT"])
          seed = os.environ.get("HW_ASSIGNMENT_SEED") or os.environ["GITHUB_RUN_ID"]
          ranked = sorted(
              slots,
              key=lambda slot: hashlib.sha256(f"{seed}:{slot}".encode()).digest(),
          )
          if current not in ranked:
              raise SystemExit(f"matrix slot {current!r} missing from HW_SLOTS_JSON")
          rank = ranked.index(current) + 1
          treatment_count = (len(ranked) + 1) // 2
          arm = "top3_treatment" if rank <= treatment_count else "unrestricted_control"
          seed_sha = hashlib.sha256(seed.encode()).hexdigest()[:12]
          print(f"{arm}\t{rank}\t{len(ranked)}\t{seed_sha}")
          PY
          )
          IFS=$'\t' read -r hw_arm assignment_rank assignment_total assignment_seed_sha <<<"$assignment"
          test -n "$hw_arm"
          allowlist=""
          if [ "$hw_arm" = "top3_treatment" ]; then
            allowlist="linux-intel-uhd620,linux-intel-uhd630,linux-amd-rdna3"
          fi
          provenance="Results/diagnostics/sunbrowser_hardware_registration.provenance.safe.json"
          {
            echo "SUNBROWSER_PROFILE_ID=ga-hw-${GITHUB_RUN_ID}-${HW_SLOT}"
            echo "SUNBROWSER_STATE_ROOT=profiles/sunbrowser-hardware-template-ab"
            echo "SUNBROWSER_PROVENANCE_OUT=$provenance"
            echo "SUNBROWSER_WEBGL_INTEGRITY_RESTARTS=0"
            echo "SUNBROWSER_HARDWARE_TEMPLATE_ALLOWLIST=$allowlist"
          } >> "$GITHUB_ENV"
          HW_ARM="$hw_arm" \
          ASSIGNMENT_RANK="$assignment_rank" \
          ASSIGNMENT_TOTAL="$assignment_total" \
          ASSIGNMENT_SEED_SHA="$assignment_seed_sha" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": "hardware_template_top3_ab_v1_balanced_hash",
              "arm": os.environ["HW_ARM"],
              "assignment_rank": int(os.environ["ASSIGNMENT_RANK"]),
              "assignment_total": int(os.environ["ASSIGNMENT_TOTAL"]),
              "assignment_seed_sha256_12": os.environ["ASSIGNMENT_SEED_SHA"],
              "allowed_templates": [
                  "linux-intel-uhd620",
                  "linux-intel-uhd630",
                  "linux-amd-rdna3",
              ],
          }
          Path("Results/diagnostics/sunbrowser_hardware_template_ab.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          echo "[SUN_HW_AB] arm=$hw_arm rank=$assignment_rank/$assignment_total"

      - name: Prepare SunBrowser fresh completion A-B
        if: ${{ inputs.variant == 'sunbrowser_fresh_completion_ab_v1' }}
        shell: bash
        env:
          FRESH_SLOT: ${{ matrix.attempt }}
          FRESH_SLOTS_JSON: ${{ inputs.node_slots_json }}
          FRESH_ASSIGNMENT_SEED: ${{ inputs.orchestration_id }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics
          if [ "$PER_IP_MAX_REGISTRATIONS" -ne 1 ]; then
            echo "sunbrowser fresh completion A/B requires per_ip_max_registrations=1" >&2
            exit 2
          fi
          assignment=$(python3 - <<'PY'
          import hashlib
          import json
          import os

          slots = [str(item) for item in json.loads(os.environ["FRESH_SLOTS_JSON"])]
          current = str(os.environ["FRESH_SLOT"])
          seed = os.environ.get("FRESH_ASSIGNMENT_SEED") or os.environ["GITHUB_RUN_ID"]
          ranked = sorted(
              slots,
              key=lambda slot: hashlib.sha256(f"{seed}:{slot}".encode()).digest(),
          )
          if current not in ranked:
              raise SystemExit(f"matrix slot {current!r} missing from FRESH_SLOTS_JSON")
          rank = ranked.index(current) + 1
          treatment_count = (len(ranked) + 1) // 2
          arm = "deadline90_treatment" if rank <= treatment_count else "deadline60_control"
          deadline_seconds = 90 if arm == "deadline90_treatment" else 60
          seed_sha = hashlib.sha256(seed.encode()).hexdigest()[:12]
          print(f"{arm}\t{deadline_seconds}\t{rank}\t{len(ranked)}\t{seed_sha}")
          PY
          )
          IFS=$'\t' read -r fresh_arm deadline_seconds assignment_rank assignment_total assignment_seed_sha <<<"$assignment"
          test -n "$fresh_arm"
          {
            echo "SUNBROWSER_FRESH_DEADLINE_SECONDS=$deadline_seconds"
            echo "OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_HOLD_RETRIES=1"
            echo "OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_RECHALLENGE_ROUNDS=1"
          } >> "$GITHUB_ENV"
          FRESH_ARM="$fresh_arm" \
          DEADLINE_SECONDS="$deadline_seconds" \
          ASSIGNMENT_RANK="$assignment_rank" \
          ASSIGNMENT_TOTAL="$assignment_total" \
          ASSIGNMENT_SEED_SHA="$assignment_seed_sha" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": "fresh_single_hold_deadline60_90_ab_v1_balanced_hash",
              "arm": os.environ["FRESH_ARM"],
              "assignment_rank": int(os.environ["ASSIGNMENT_RANK"]),
              "assignment_total": int(os.environ["ASSIGNMENT_TOTAL"]),
              "assignment_seed_sha256_12": os.environ["ASSIGNMENT_SEED_SHA"],
              "deadline_seconds": int(os.environ["DEADLINE_SECONDS"]),
              "fresh_hold_retries": 1,
              "fresh_rounds": 1,
          }
          Path("Results/diagnostics/sunbrowser_fresh_completion_ab.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          echo "[SUN_FRESH_AB] arm=$fresh_arm deadline_seconds=$deadline_seconds rank=$assignment_rank/$assignment_total"

      - name: Prepare offline ADS fresh cookie continuity A-B
        if: ${{ inputs.variant == 'offline_ads_pool_fresh_cookie_ab_v1' }}
        shell: bash
        env:
          COOKIE_SLOT: ${{ matrix.attempt }}
          COOKIE_SLOTS_JSON: ${{ inputs.node_slots_json }}
          COOKIE_ASSIGNMENT_SEED: ${{ inputs.orchestration_id }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
        run: |
          set -euo pipefail
          mkdir -p Results/diagnostics
          if [ "$PER_IP_MAX_REGISTRATIONS" -ne 1 ]; then
            echo "fresh cookie continuity A/B requires per_ip_max_registrations=1" >&2
            exit 2
          fi
          assignment=$(python3 - <<'PY'
          import hashlib
          import json
          import os

          slots = [str(item) for item in json.loads(os.environ["COOKIE_SLOTS_JSON"])]
          current = str(os.environ["COOKIE_SLOT"])
          seed = os.environ.get("COOKIE_ASSIGNMENT_SEED") or os.environ["GITHUB_RUN_ID"]
          ranked = sorted(
              slots,
              key=lambda slot: hashlib.sha256(f"{seed}:{slot}".encode()).digest(),
          )
          if current not in ranked:
              raise SystemExit(f"matrix slot {current!r} missing from COOKIE_SLOTS_JSON")
          rank = ranked.index(current) + 1
          treatment_count = (len(ranked) + 1) // 2
          arm = "preserve_treatment" if rank <= treatment_count else "clear_control"
          clear_solution_cookies = 0 if arm == "preserve_treatment" else 1
          seed_sha = hashlib.sha256(seed.encode()).hexdigest()[:12]
          print(
              f"{arm}\t{clear_solution_cookies}\t{rank}\t{len(ranked)}\t{seed_sha}"
          )
          PY
          )
          IFS=$'\t' read -r cookie_arm clear_solution_cookies assignment_rank assignment_total assignment_seed_sha <<<"$assignment"
          test -n "$cookie_arm"
          echo "OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_CLEAR_SOLUTION_COOKIES=$clear_solution_cookies" >> "$GITHUB_ENV"
          COOKIE_ARM="$cookie_arm" \
          CLEAR_SOLUTION_COOKIES="$clear_solution_cookies" \
          ASSIGNMENT_RANK="$assignment_rank" \
          ASSIGNMENT_TOTAL="$assignment_total" \
          ASSIGNMENT_SEED_SHA="$assignment_seed_sha" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": "fresh_solution_cookie_preserve_ab_v1_balanced_hash",
              "arm": os.environ["COOKIE_ARM"],
              "assignment_rank": int(os.environ["ASSIGNMENT_RANK"]),
              "assignment_total": int(os.environ["ASSIGNMENT_TOTAL"]),
              "assignment_seed_sha256_12": os.environ["ASSIGNMENT_SEED_SHA"],
              "clear_solution_cookies": (
                  os.environ["CLEAR_SOLUTION_COOKIES"] == "1"
              ),
          }
          Path("Results/diagnostics/offline_ads_fresh_cookie_ab.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          echo "[OFFLINE_FRESH_COOKIE_AB] arm=$cookie_arm clear=$clear_solution_cookies rank=$assignment_rank/$assignment_total"

      - name: Run no-proxy live probe on GA own IP
        if: ${{ steps.egress.outputs.should_probe != 'false' }}
        id: live
        shell: bash
        env:
          PRE_FIRST_HOLD_WARMUP_POLICY: ${{ inputs.pre_first_hold_warmup_policy }}
          PRE_FIRST_HOLD_WARMUP_INPUT_MS: ${{ inputs.pre_first_hold_warmup_ms }}
          SIGNUP_COUNTRY_POLICY: ${{ inputs.signup_country_policy }}
          SIGNUP_DOB_POLICY: ${{ inputs.signup_dob_policy }}
          EMAIL_DOMAIN_POLICY: ${{ inputs.email_domain_policy }}
          OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_ABSOLUTE_TIMEOUT_SECONDS: ${{ inputs.fresh_absolute_timeout_seconds }}
          OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_RECHALLENGE_ROUNDS: ${{ inputs.variant == 'sunbrowser_fresh_completion_ab_v1' && '1' || inputs.variant == 'online_ads_ga_production_fast_fail' && '0' || '' }}
          OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_HOLD_RETRIES: ${{ inputs.variant == 'sunbrowser_fresh_completion_ab_v1' && '1' || '' }}
          FRESH_SESSION_RESTART_POLICY: ${{ inputs.fresh_session_restart_policy }}
          RISK_VERIFY_GATE_MS: ${{ (inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' && '900') || (inputs.variant == 'offline_ads_pool_rechallenge_gate_v2' && '1600') || '' }}
          RISK_VERIFY_GATE_TIMEOUT_MS: ${{ (inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' && '3000') || (inputs.variant == 'offline_ads_pool_rechallenge_gate_v2' && '4000') || '' }}
          RISK_VERIFY_SERVER_RETRY_COUNT: ${{ (inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' && '1') || (inputs.variant == 'offline_ads_pool_rechallenge_gate_v2' && '2') || '' }}
          RISK_VERIFY_SERVER_RETRY_DELAY_MS: ${{ (inputs.variant == 'offline_ads_pool_rechallenge_gate_v1' && '1200') || (inputs.variant == 'offline_ads_pool_rechallenge_gate_v2' && '1500') || '' }}
        run: |
          set +e
          mkdir -p Results/diagnostics
          if [ "${{ inputs.variant }}" = "sunbrowser_fresh_completion_ab_v1" ]; then
            export OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_ABSOLUTE_TIMEOUT_SECONDS="${SUNBROWSER_FRESH_DEADLINE_SECONDS}"
          fi
          warmup_policy="$PRE_FIRST_HOLD_WARMUP_POLICY"
          warmup_arm="fixed_input"
          warmup_ms="$PRE_FIRST_HOLD_WARMUP_INPUT_MS"
          warmup_profile_index=-1
          warmup_profile_cycle=-1
          case "$warmup_policy" in
            fixed_input)
              ;;
            warmup_ab_14s_22s_v1)
              # The online ADS pool has 35 eligible templates. Alternate each
              # template's arm on its next cycle so a 100-slot run is exactly
              # 50/50 and both arms see every repeated profile.
              warmup_profile_index=$(( (${{ matrix.attempt }} - 1) % 35 ))
              warmup_profile_cycle=$(( (${{ matrix.attempt }} - 1) / 35 ))
              if [ $(( (warmup_profile_index + warmup_profile_cycle) % 2 )) -eq 0 ]; then
                warmup_arm="warmup_14s_treatment"
                warmup_ms="14000"
              else
                warmup_arm="warmup_22s_control"
                warmup_ms="22000"
              fi
              ;;
            warmup_14s_v1)
              warmup_arm="warmup_14s_treatment"
              warmup_ms="14000"
              ;;
            warmup_22s_v1)
              warmup_arm="warmup_22s_control"
              warmup_ms="22000"
              ;;
            *)
              echo "unsupported pre-first-hold warmup policy: $warmup_policy" >&2
              exit 2
              ;;
          esac
          if [ -n "$warmup_ms" ]; then
            if ! [[ "$warmup_ms" =~ ^[0-9]+$ ]] || [ "$warmup_ms" -gt 45000 ]; then
              echo "pre-first-hold warmup must be blank or 0..45000ms" >&2
              exit 2
            fi
          fi
          experiment_count=0
          [ "$warmup_policy" != "fixed_input" ] && experiment_count=$((experiment_count + 1))
          [ "$SIGNUP_COUNTRY_POLICY" != "source_default" ] && experiment_count=$((experiment_count + 1))
          [ "$SIGNUP_DOB_POLICY" != "source_default" ] && experiment_count=$((experiment_count + 1))
          [ "$EMAIL_DOMAIN_POLICY" != "source_default" ] && experiment_count=$((experiment_count + 1))
          if [ "$experiment_count" -gt 1 ]; then
            echo "only one success-rate experiment may be enabled per run" >&2
            exit 2
          fi
          export OUTLOOK_CAPTCHA_PRE_FIRST_HOLD_WARMUP_MS="$warmup_ms"
          WARMUP_POLICY="$warmup_policy" \
          WARMUP_ARM="$warmup_arm" \
          WARMUP_MS="$warmup_ms" \
          WARMUP_PROFILE_INDEX="$warmup_profile_index" \
          WARMUP_PROFILE_CYCLE="$warmup_profile_cycle" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("WARMUP_MS", "")
          row = {
              "policy": os.environ["WARMUP_POLICY"],
              "arm": os.environ["WARMUP_ARM"],
              "effective_ms": int(value) if value else None,
              "ads_profile_index_block": int(os.environ["WARMUP_PROFILE_INDEX"]),
              "ads_profile_cycle_block": int(os.environ["WARMUP_PROFILE_CYCLE"]),
              "applied_to_probe": True,
          }
          Path("Results/diagnostics/pre_first_hold_warmup.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          country_policy="$SIGNUP_COUNTRY_POLICY"
          country_arm="source_default"
          country_code=""
          country_profile_index=-1
          country_profile_cycle=-1
          case "$country_policy" in
            source_default)
              ;;
            country_ab_us_lk_v1)
              country_profile_index=$(( (${{ matrix.attempt }} - 1) % 35 ))
              country_profile_cycle=$(( (${{ matrix.attempt }} - 1) / 35 ))
              if [ $(( (country_profile_index + country_profile_cycle) % 2 )) -eq 0 ]; then
                country_arm="country_us_treatment"
                country_code="US"
              else
                country_arm="country_lk_control"
                country_code="LK"
              fi
              ;;
            country_us_v1)
              country_arm="country_us_treatment"
              country_code="US"
              ;;
            country_lk_v1)
              country_arm="country_lk_control"
              country_code="LK"
              ;;
            *)
              echo "unsupported signup country policy: $country_policy" >&2
              exit 2
              ;;
          esac
          if [ -n "$country_code" ]; then
            export OUTLOOK_SIGNUP_COUNTRY_CODE="$country_code"
          else
            unset OUTLOOK_SIGNUP_COUNTRY_CODE
          fi
          COUNTRY_POLICY="$country_policy" \
          COUNTRY_ARM="$country_arm" \
          COUNTRY_CODE="$country_code" \
          COUNTRY_PROFILE_INDEX="$country_profile_index" \
          COUNTRY_PROFILE_CYCLE="$country_profile_cycle" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": os.environ["COUNTRY_POLICY"],
              "arm": os.environ["COUNTRY_ARM"],
              "country_code": os.environ.get("COUNTRY_CODE") or None,
              "ads_profile_index_block": int(os.environ["COUNTRY_PROFILE_INDEX"]),
              "ads_profile_cycle_block": int(os.environ["COUNTRY_PROFILE_CYCLE"]),
              "applied_to_probe": True,
          }
          Path("Results/diagnostics/signup_country_policy.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          dob_policy="$SIGNUP_DOB_POLICY"
          dob_arm="source_default"
          dob_mode=""
          dob_profile_index=-1
          dob_profile_cycle=-1
          case "$dob_policy" in
            source_default)
              ;;
            dob_ab_random_default_v1)
              dob_profile_index=$(( (${{ matrix.attempt }} - 1) % 35 ))
              dob_profile_cycle=$(( (${{ matrix.attempt }} - 1) / 35 ))
              if [ $(( (dob_profile_index + dob_profile_cycle) % 2 )) -eq 0 ]; then
                dob_arm="dob_random_treatment"
                dob_mode="random"
              else
                dob_arm="dob_jan1_control"
                dob_mode="source_default"
              fi
              ;;
            dob_random_v1)
              dob_arm="dob_random_treatment"
              dob_mode="random"
              ;;
            dob_default_v1)
              dob_arm="dob_jan1_control"
              dob_mode="source_default"
              ;;
            *)
              echo "unsupported signup DOB policy: $dob_policy" >&2
              exit 2
              ;;
          esac
          if [ "$dob_mode" = "random" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          profile = data.setdefault("signup_fill_profile", {})
          if not isinstance(profile, dict):
              raise SystemExit("signup_fill_profile must be an object")
          profile["birth_mode"] = "random"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          fi
          DOB_POLICY="$dob_policy" \
          DOB_ARM="$dob_arm" \
          DOB_MODE="$dob_mode" \
          DOB_PROFILE_INDEX="$dob_profile_index" \
          DOB_PROFILE_CYCLE="$dob_profile_cycle" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          row = {
              "policy": os.environ["DOB_POLICY"],
              "arm": os.environ["DOB_ARM"],
              "mode": os.environ.get("DOB_MODE") or None,
              "ads_profile_index_block": int(os.environ["DOB_PROFILE_INDEX"]),
              "ads_profile_cycle_block": int(os.environ["DOB_PROFILE_CYCLE"]),
              "applied_to_probe": True,
          }
          Path("Results/diagnostics/signup_dob_policy.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          domain_policy="$EMAIL_DOMAIN_POLICY"
          domain_arm="source_default"
          email_suffix=""
          domain_profile_index=-1
          domain_profile_cycle=-1
          case "$domain_policy" in
            source_default)
              ;;
            domain_ab_hotmail_outlook_v1)
              domain_profile_index=$(( (${{ matrix.attempt }} - 1) % 35 ))
              domain_profile_cycle=$(( (${{ matrix.attempt }} - 1) / 35 ))
              if [ $(( (domain_profile_index + domain_profile_cycle) % 2 )) -eq 0 ]; then
                domain_arm="hotmail_treatment"
                email_suffix="@hotmail.com"
              else
                domain_arm="outlook_control"
                email_suffix="@outlook.com"
              fi
              ;;
            domain_hotmail_v1)
              domain_arm="hotmail_treatment"
              email_suffix="@hotmail.com"
              ;;
            domain_outlook_v1)
              domain_arm="outlook_control"
              email_suffix="@outlook.com"
              ;;
            *)
              echo "unsupported email domain policy: $domain_policy" >&2
              exit 2
              ;;
          esac
          if [ -n "$email_suffix" ]; then
            EMAIL_SUFFIX="$email_suffix" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          suffix = os.environ["EMAIL_SUFFIX"]
          if suffix not in {"@hotmail.com", "@outlook.com"}:
              raise SystemExit("unsupported email suffix")
          path = Path("config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["email_suffix"] = suffix
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          fi
          DOMAIN_POLICY="$domain_policy" \
          DOMAIN_ARM="$domain_arm" \
          EMAIL_SUFFIX="$email_suffix" \
          DOMAIN_PROFILE_INDEX="$domain_profile_index" \
          DOMAIN_PROFILE_CYCLE="$domain_profile_cycle" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          suffix = os.environ.get("EMAIL_SUFFIX") or None
          row = {
              "policy": os.environ["DOMAIN_POLICY"],
              "arm": os.environ["DOMAIN_ARM"],
              "domain": suffix[1:] if suffix else None,
              "ads_profile_index_block": int(os.environ["DOMAIN_PROFILE_INDEX"]),
              "ads_profile_cycle_block": int(os.environ["DOMAIN_PROFILE_CYCLE"]),
              "applied_to_probe": True,
          }
          Path("Results/diagnostics/email_domain_policy.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
          private_console="Results/diagnostics/public_runner_private_console.log"
          echo "GA_OWN_IP_ATTEMPT=${{ matrix.attempt }}"
          echo "NETWORK_MODE=${{ inputs.network_mode }}"
          echo "pre_first_hold_warmup_policy=$warmup_policy arm=$warmup_arm"
          echo "OUTLOOK_CAPTCHA_PRE_FIRST_HOLD_WARMUP_MS=${OUTLOOK_CAPTCHA_PRE_FIRST_HOLD_WARMUP_MS:-config-default}"
          echo "signup_country_policy=$country_policy arm=$country_arm code=${OUTLOOK_SIGNUP_COUNTRY_CODE:-source-default}"
          echo "signup_dob_policy=$dob_policy arm=$dob_arm mode=${dob_mode:-source-default}"
          echo "email_domain_policy=$domain_policy arm=$domain_arm domain=${email_suffix:-source-default}"
          echo "per_ip_max_registrations=${{ inputs.per_ip_max_registrations }}"
          variant="${{ inputs.variant }}"
          echo "probe_timeout_minutes=${{ inputs.probe_timeout_minutes }}"
          echo "fresh_absolute_timeout_seconds=${OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_ABSOLUTE_TIMEOUT_SECONDS}"
          echo "fresh_rechallenge_rounds=${OUTLOOK_SIGNUP_PROTOCOL_TAKEOVER_FRESH_RECHALLENGE_ROUNDS:-source-default}"
          echo "fresh_session_restart_policy=${FRESH_SESSION_RESTART_POLICY}"
          if [ "$variant" = "paired_5s_then_thin" ] || [ "$variant" = "paired_thin_then_5s" ]; then
            if [ "${{ inputs.per_ip_max_registrations }}" -ne 1 ]; then
              echo "paired variants require per_ip_max_registrations=1" >&2
              exit 2
            fi
            if [ "$variant" = "paired_5s_then_thin" ]; then
              labels=(five_seconds thin)
              commands=(./run_xvfb_semiprotocol_5s_1920.sh ./run_xvfb_natural_1920.sh)
            else
              labels=(thin five_seconds)
              commands=(./run_xvfb_natural_1920.sh ./run_xvfb_semiprotocol_5s_1920.sh)
            fi
            : > "$private_console"
            ec=0
            for i in 0 1; do
              echo "[PUBLIC_AB] begin order=$i variant=${labels[$i]}" | tee -a "$private_console"
              timeout --foreground "${{ inputs.probe_timeout_minutes }}m" "${commands[$i]}" \
                >>"$private_console" 2>&1
              one_ec=$?
              echo "[PUBLIC_AB] end order=$i variant=${labels[$i]} exit_code=$one_ec" | tee -a "$private_console"
              if [ "$one_ec" = "124" ]; then
                echo "paired_${labels[$i]}_probe_timeout" > "Results/diagnostics/paired_${labels[$i]}_probe_timeout.txt"
              fi
            done
          else
            cmd=()
            if [ "$variant" = "semiprotocol_5s_stable" ]; then
              cmd=(./run_xvfb_semiprotocol_5s_1920.sh)
