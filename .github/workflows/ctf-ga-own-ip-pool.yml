            elif [ "$variant" = "natural_legacy" ]; then
              cmd=(./run_xvfb_natural_legacy_1920.sh)
            elif [ "$variant" = "online_ads_ga_5s_hold_transplant" ]; then
              cmd=(./run_xvfb_natural_5s_transplant_1920.sh)
            elif [ "$variant" = "online_ads_ga_fresh_5s_recovery" ]; then
              cmd=(./run_xvfb_natural_fresh_5s_1920.sh)
            elif [ "$variant" = "historical_ga_success_default" ] || [ "$variant" = "historical_ga_highrate_336a973" ] || [ "$variant" = "historical_ga_fresh_rechallenge" ] || [ "$variant" = "online_ads_ga_fresh_rechallenge" ] || [ "$variant" = "online_ads_ga_production_fast_fail" ] || [ "$variant" = "offline_ads_like_ga_fresh_rechallenge" ] || [ "$variant" = "offline_ads_pool_ga_fresh_rechallenge" ] || [ "$variant" = "offline_ads_pool_balanced_shuffle_v1" ] || [ "$variant" = "offline_ads_pool_fresh_cookie_ab_v1" ]; then
              cmd=(./run_xvfb_natural_1920.sh)
            else
              cmd=(./run_xvfb_natural_1920.sh)
            fi
            if [ "$variant" = "sunbrowser_profile_state_ab_v1" ] && [ "${SUNBROWSER_PROFILE_STATE_SETUP_OK:-false}" != "true" ]; then
              echo "[SUN_PROFILE_AB] registration skipped because setup failed" > "$private_console"
              ec=2
            elif [ "${{ inputs.per_ip_max_registrations }}" -gt 1 ]; then
              python3 tools/run_ga_ip_capacity_loop.py \
                --variant "$variant" \
                --max-registrations "${{ inputs.per_ip_max_registrations }}" \
                --probe-timeout-minutes "${{ inputs.probe_timeout_minutes }}" \
                >"$private_console" 2>&1
              ec=$?
            elif [ "$variant" = "online_ads_ga_production_fast_fail" ] && [ "$FRESH_SESSION_RESTART_POLICY" != "off" ]; then
              session_policy="$FRESH_SESSION_RESTART_POLICY"
              session_arm="restart_treatment"
              if [ "$session_policy" = "fresh_ab_v1" ] && [ $(( ${{ matrix.attempt }} % 2 )) -eq 0 ]; then
                session_arm="single_session_control"
              elif [ "$session_policy" != "fresh_ab_v1" ] && [ "$session_policy" != "fresh_all_v1" ]; then
                echo "unsupported fresh session restart policy: $session_policy" >&2
                exit 2
              fi
              # The 60-second restart experiment was rejected for production.
              # Keep its exact replay behavior without spending another scarce
              # workflow_dispatch input on an unpromoted tuning scalar.
              cooldown="60"

              first_log="Results/diagnostics/fresh_session_first.log"
              second_log="Results/diagnostics/fresh_session_second.log"
              : > "$private_console"
              echo "[SESSION_RESTART] first begin arm=$session_arm" >> "$private_console"
              timeout --foreground "${{ inputs.probe_timeout_minutes }}m" "${cmd[@]}" \
                >"$first_log" 2>&1
              first_ec=$?
              cat "$first_log" >> "$private_console"
              echo "[SESSION_RESTART] first end exit_code=$first_ec" >> "$private_console"
              first_fresh=0
              first_strict=0
              restart_attempted=0
              second_ec=""
              second_strict=0
              second_fresh=0
              second_riskblock=0
              grep -q 'fresh rechallenge skipped by production policy rounds=0' "$first_log" && first_fresh=1
              grep -q 'CreateAccount strict success' "$first_log" && first_strict=1

              ec=$first_ec
              if [ "$session_arm" = "restart_treatment" ] && [ "$first_fresh" -eq 1 ]; then
                restart_attempted=1
                echo "[SESSION_RESTART] cooldown_seconds=$cooldown" >> "$private_console"
                sleep "$cooldown"
                echo "[SESSION_RESTART] second begin" >> "$private_console"
                GA_COORDINATOR_SLOT="${{ matrix.attempt }}-session2" \
                  timeout --foreground 12m "${cmd[@]}" >"$second_log" 2>&1
                second_ec=$?
                cat "$second_log" >> "$private_console"
                echo "[SESSION_RESTART] second end exit_code=$second_ec" >> "$private_console"
                grep -q 'CreateAccount strict success' "$second_log" && second_strict=1
                grep -q 'fresh rechallenge skipped by production policy rounds=0' "$second_log" && second_fresh=1
                grep -qi 'riskblock' "$second_log" && second_riskblock=1
                ec=$second_ec
              fi

              if [ "$first_ec" = "124" ] || [ "$second_ec" = "124" ]; then
                echo "probe_timeout" > Results/diagnostics/probe_timeout.txt
              fi
              SESSION_POLICY="$session_policy" \
              SESSION_ARM="$session_arm" \
              SESSION_COOLDOWN="$cooldown" \
              FIRST_EXIT_CODE="$first_ec" \
              FIRST_FRESH="$first_fresh" \
              FIRST_STRICT="$first_strict" \
              RESTART_ATTEMPTED="$restart_attempted" \
              SECOND_EXIT_CODE="$second_ec" \
              SECOND_STRICT="$second_strict" \
              SECOND_FRESH="$second_fresh" \
              SECOND_RISKBLOCK="$second_riskblock" \
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def as_bool(name):
              return os.environ.get(name) == "1"

          second_exit = os.environ.get("SECOND_EXIT_CODE", "")
          row = {
              "policy": os.environ["SESSION_POLICY"],
              "arm": os.environ["SESSION_ARM"],
              "cooldown_seconds": int(os.environ["SESSION_COOLDOWN"]),
              "first_exit_code": int(os.environ["FIRST_EXIT_CODE"]),
              "first_fresh_policy_skip": as_bool("FIRST_FRESH"),
              "first_strict_marker": as_bool("FIRST_STRICT"),
              "restart_attempted": as_bool("RESTART_ATTEMPTED"),
              "second_exit_code": int(second_exit) if second_exit else None,
              "second_strict_marker": as_bool("SECOND_STRICT"),
              "second_fresh_policy_skip": as_bool("SECOND_FRESH"),
              "second_riskblock_marker": as_bool("SECOND_RISKBLOCK"),
              "recovered_strict": as_bool("RESTART_ATTEMPTED") and as_bool("SECOND_STRICT"),
          }
          Path("Results/diagnostics/fresh_session_restart.json").write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY
            else
              timeout --foreground "${{ inputs.probe_timeout_minutes }}m" "${cmd[@]}" \
                >"$private_console" 2>&1
              ec=$?
              if [ "$ec" = "124" ]; then
                echo "[GAOwnIP] probe timed out after ${{ inputs.probe_timeout_minutes }}m"
                echo "probe_timeout" > Results/diagnostics/probe_timeout.txt
              fi
            fi
          fi
          if grep -q 'fresh rechallenge skipped by production policy rounds=0' "$private_console" 2>/dev/null; then
            : > Results/diagnostics/fresh_rechallenge_policy_skip.txt
          fi
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          echo "public_safe_probe_summary:"
          grep -E "\[PUBLIC_AB\]|\[SUN_PROFILE_AB\]|outlook_register result=|riskblock|collector_minus1|real final result\|-1|CreateAccount strict success|probe timed out|fresh rechallenge skipped by production policy|fresh rechallenge absolute timeout|fresh rechallenge no progress|fresh rechallenge idle timeout" "$private_console" 2>/dev/null \
            | sed -E 's/[[:alnum:]._%+-]+@(outlook|hotmail)\.com/<redacted-email>/g' \
            | tail -40 || true
          # Matrix attempts are allowed to fail individually. The summarize job
          # evaluates redacted per-slot verdicts and rejects technical failures
          # or an all-IP-blocked run with no decisive non-IP checkpoint.
          exit 0

      - name: Finalize SunBrowser WebGL integrity A-B evidence
        if: ${{ always() && inputs.variant == 'sunbrowser_webgl_integrity_ab_v1' }}
        shell: bash
        env:
          REGISTRATION_EC: ${{ steps.live.outputs.exit_code }}
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def as_int(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          result_path = Path("Results/diagnostics/sunbrowser_webgl_integrity_ab.json")
          row = load_json(result_path)
          provenance = load_json(
              "Results/diagnostics/sunbrowser_webgl_registration.provenance.safe.json"
          )
          runtime = provenance.get("runtime") or {}
          attempts = runtime.get("fingerprint_preflight_attempts") or []
          if not isinstance(attempts, list):
              attempts = []
          first = attempts[0] if attempts and isinstance(attempts[0], dict) else {}
          final = attempts[-1] if attempts and isinstance(attempts[-1], dict) else {}
          final_reasons = final.get("webgl_integrity_reasons") or []
          if not isinstance(final_reasons, list):
              final_reasons = []
          final_reasons = [
              reason for reason in final_reasons
              if isinstance(reason, str) and len(reason) <= 80
          ][:8]
          final_ok = runtime.get("webgl_integrity_final_ok") is True
          row.update({
              "registration_exit_code": as_int(os.environ.get("REGISTRATION_EC")),
              "preflight_attempt_count": len(attempts),
              "initial_webgl_integrity_failed": (
                  first.get("webgl_integrity_ok") is False if first else None
              ),
              "final_webgl_integrity_ok": final_ok if attempts else None,
              "webgl_integrity_recovered": (
                  runtime.get("webgl_integrity_recovered") is True
              ),
              "restart_count": as_int(runtime.get("webgl_integrity_restart_count")),
              "integrity_setup_invalid": bool(
                  attempts
                  and row.get("arm") == "restart2_treatment"
                  and not final_ok
              ),
              "final_integrity_reasons": final_reasons,
          })
          result_path.parent.mkdir(parents=True, exist_ok=True)
          result_path.write_text(
              json.dumps(row, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(row, ensure_ascii=False))
          PY

