      - name: Import successful account into outlookEmail
        if: ${{ always() && steps.egress.outputs.should_probe != 'false' }}
        shell: bash
        env:
          # Keep the ingestion credential out of the probe and every other
          # process launched from the checked-out private source.
          OUTLOOK_EMAIL_BASE_URL: ${{ vars.OUTLOOK_EMAIL_BASE_URL }}
          OUTLOOK_EMAIL_API_KEY: ${{ secrets.OUTLOOK_EMAIL_API_KEY }}
        run: |
          set +e
          mkdir -p Results/diagnostics
          safe_result="Results/diagnostics/outlook_email_ingest.json"
          request_file="${RUNNER_TEMP}/outlook-email-ingest-request-${{ matrix.attempt }}.json"
          response_file="${RUNNER_TEMP}/outlook-email-ingest-response-${{ matrix.attempt }}.json"
          rm -f "$request_file" "$response_file"
          trap 'rm -f "$request_file" "$response_file"' EXIT
          if [ -z "${OUTLOOK_EMAIL_BASE_URL:-}" ] || [ -z "${OUTLOOK_EMAIL_API_KEY:-}" ]; then
            printf '%s\n' '{"attempted":false,"reason":"integration_not_configured"}' > "$safe_result"
            exit 0
          fi
          case "$OUTLOOK_EMAIL_BASE_URL" in
            https://*) ;;
            *)
              printf '%s\n' '{"attempted":false,"reason":"invalid_https_base_url"}' > "$safe_result"
              exit 0
              ;;
          esac
          source_file=""
          for candidate in Results/unlogged_email.txt Results/logged_email.txt; do
            if [ -s "$candidate" ]; then source_file="$candidate"; break; fi
          done
          if [ -z "$source_file" ]; then
            printf '%s\n' '{"attempted":false,"reason":"no_registered_account"}' > "$safe_result"
            exit 0
          fi
          if ! SOURCE_FILE="$source_file" REQUEST_FILE="$request_file" python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = [x.strip() for x in Path(os.environ['SOURCE_FILE']).read_text(encoding='utf-8').splitlines() if x.strip()]
          email, sep, password = lines[-1].partition(': ')
          if not sep or '@' not in email or not password:
              raise SystemExit('invalid private result format')
          Path(os.environ['REQUEST_FILE']).write_text(json.dumps({
              'email': email.strip(),
              'password': password,
              'mode': 'graph',
              'remark': 'ga-run-${{ github.run_id }}-slot-${{ matrix.attempt }}',
          }), encoding='utf-8')
          PY
          then
            printf '%s\n' '{"attempted":true,"success":false,"reason":"invalid_private_result"}' > "$safe_result"
            exit 0
          fi
          success=false
          # Retry only transport/route availability failures here. OAuth and
          # Graph provisioning retries are persisted and rate-limited by the
          # backend so this runner never repeats account login in a tight loop.
          retry_delays=(0 30 90)
          for retry in 1 2 3; do
            if [ "$retry" -gt 1 ]; then
              sleep "${retry_delays[$((retry - 1))]}"
            fi
            rm -f "$response_file"
            http_code=$(curl -sS --connect-timeout 10 --max-time 120 \
              -o "$response_file" -w '%{http_code}' \
              -H "X-API-Key: ${OUTLOOK_EMAIL_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request_file" \
              "${OUTLOOK_EMAIL_BASE_URL%/}/api/external/outlook/import-authorize" || true)
            HTTP_CODE="$http_code" RETRY="$retry" RESPONSE_FILE="$response_file" python3 - <<'PY'
          import json, os
          from pathlib import Path
          try:
              row = json.loads(Path(os.environ['RESPONSE_FILE']).read_text(encoding='utf-8'))
          except Exception:
              row = {}
          http_code = os.environ.get('HTTP_CODE', '')
          ok = http_code.isdigit() and 200 <= int(http_code) < 300 and row.get('success') is True
          allowed_error_codes = {
              'input_invalid', 'oauth_failed', 'token_validation_failed',
              'imap_probe_failed', 'graph_probe_failed', 'platform_config_error',
          }
          error_code = str(row.get('error_code') or '')
          if error_code not in allowed_error_codes:
              error_code = None
          safe = {
              'attempted': True,
              'success': ok,
              'http_code': http_code,
              'retry': int(os.environ.get('RETRY', '0')),
              'account_id': row.get('account_id') if ok else None,
              'created': row.get('created') if ok else None,
              'error_code': error_code if not ok else None,
              'retry_scheduled': bool(row.get('retry_scheduled')) if not ok else False,
              'backend_attempt_count': int(row.get('attempt_count') or 0),
          }
          Path('Results/diagnostics/outlook_email_ingest.json').write_text(
              json.dumps(safe, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          if ok:
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            parse_ec=$?
            if [ "$parse_ec" -eq 0 ]; then
              success=true
              break
            fi
            case "$http_code" in
              000|404|408|425|429|502|503|504)
                echo "outlookEmail route unavailable; retry=$retry/3 status=$http_code"
                continue
                ;;
              *) break ;;
            esac
          done
          echo "outlookEmail integration attempted success=$success"
          exit 0

      - name: Build redacted machine-readable verdict
        if: ${{ always() }}
        shell: bash
        env:
          ATTEMPT: ${{ matrix.attempt }}
          VARIANT: ${{ inputs.variant }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          RUNNER_LABEL: ${{ inputs.runner }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
          ADS_PROFILE_POLICY_INPUT: ${{ inputs.ads_profile_policy }}
          FRESH_SESSION_RESTART_POLICY_INPUT: ${{ inputs.fresh_session_restart_policy }}
          PRE_FIRST_HOLD_WARMUP_POLICY_INPUT: ${{ inputs.pre_first_hold_warmup_policy }}
          PRE_FIRST_HOLD_WARMUP_INPUT_MS: ${{ inputs.pre_first_hold_warmup_ms }}
          SIGNUP_COUNTRY_POLICY_INPUT: ${{ inputs.signup_country_policy }}
          SIGNUP_DOB_POLICY_INPUT: ${{ inputs.signup_dob_policy }}
          EMAIL_DOMAIN_POLICY_INPUT: ${{ inputs.email_domain_policy }}
          COORDINATOR_MODE: ${{ inputs.coordinator_mode }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RUNTIME_MODE: ${{ inputs.runtime_mode }}
          PROBE_TIMEOUT_MINUTES: ${{ inputs.probe_timeout_minutes }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          PER_IP_MAX_REGISTRATIONS: ${{ inputs.per_ip_max_registrations }}
          PROBE_EXIT_CODE: ${{ steps.live.outputs.exit_code }}
        run: |
          set +e
          mkdir -p public-safe-verdict
          latest=$(ls -t Results/network/*.jsonl 2>/dev/null | head -n1 || true)
          if [ -n "$latest" ] && [ -f classify_protocol_run.py ]; then
            . .venv/bin/activate 2>/dev/null || true
            python classify_protocol_run.py "$latest" > /tmp/private_classification.json 2>/dev/null || true
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def load_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def bounded_int(value, minimum, maximum):
              try:
                  parsed = int(value)
              except (TypeError, ValueError):
                  return None
              return parsed if minimum <= parsed <= maximum else None

          def optional_bool(value):
              return value if isinstance(value, bool) else None

          def load_protocol_event_evidence():
              rows = []
              for path in sorted(Path("Results/protocol_takeover").glob("*.jsonl")):
                  try:
                      lines = path.read_text(encoding="utf-8").splitlines()
                  except Exception:
                      continue
                  for line in lines:
                      try:
                          event_row = json.loads(line)
                      except Exception:
                          continue
                      if isinstance(event_row, dict):
                          rows.append(event_row)
              starts = [
                  event_row for event_row in rows
                  if event_row.get("event") == "fresh_rechallenge_start"
              ]
              done = [
                  event_row for event_row in rows
                  if event_row.get("event") == "fresh_rechallenge_captcha_done"
              ]
              resets = [
                  event_row for event_row in rows
                  if event_row.get("event") == "fresh_rechallenge_isolation_reset"
              ]
              policies = sorted({
                  str(event_row.get("solution_cookie_policy"))
                  for event_row in resets
                  if event_row.get("solution_cookie_policy") in {"clear", "preserve"}
              })
              return {
                  "rounds_started": min(len(starts), 3),
                  "captcha_result0": any(
                      (event_row.get("protocol") or {}).get("ok") is True
                      for event_row in done
                  ),
                  "nested": any(
                      event_row.get("event") == "fresh_rechallenge_nested"
                      for event_row in rows
                  ),
                  "solution_cookie_policy_observed": (
                      policies[0] if len(policies) == 1 else None
                  ),
              }

          row = load_json("/tmp/private_classification.json")
          ingest = load_json("Results/diagnostics/outlook_email_ingest.json")
          ads_fetch = load_json("Results/diagnostics/ads_online_fetch.json")
          ads_offline_select = load_json(
              "Results/diagnostics/ads_offline_select.json"
          )
          session_restart = load_json("Results/diagnostics/fresh_session_restart.json")
          warmup = load_json("Results/diagnostics/pre_first_hold_warmup.json")
