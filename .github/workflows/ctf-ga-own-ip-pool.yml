              ),
              "sunbrowser_profile_state_assignment_total": (
                  sunbrowser_profile_state_assignment_total
              ),
              "sunbrowser_profile_state_assignment_seed_sha256_12": (
                  sunbrowser_profile_state_assignment_seed_sha
              ),
              "sunbrowser_profile_state_uses_prewarmed": (
                  sunbrowser_profile_state.get("registration_uses_prewarmed_state") is True
              ),
              "sunbrowser_profile_state_init_exit_code": sunbrowser_profile_state_init_exit,
              "sunbrowser_profile_state_copy_exit_code": sunbrowser_profile_state_copy_exit,
              "sunbrowser_profile_state_prewarm_exit_code": sunbrowser_profile_state_prewarm_exit,
              "sunbrowser_profile_state_registration_exit_code": (
                  sunbrowser_profile_state_registration_exit
              ),
              "sunbrowser_profile_state_cookie_count": sunbrowser_profile_state_cookie_count,
              "sunbrowser_profile_state_bundle_match": (
                  sunbrowser_profile_state.get("bundle_match") is True
              ),
              "sunbrowser_profile_state_source_match": (
                  sunbrowser_profile_state.get("state_source_match") is True
              ),
              "sunbrowser_profile_state_before_bytes": sunbrowser_profile_state_before_bytes,
              "sunbrowser_profile_state_before_markers": sunbrowser_profile_state_before_markers,
              "sunbrowser_webgl_policy": sunbrowser_webgl_policy,
              "sunbrowser_webgl_arm": sunbrowser_webgl_arm,
              "sunbrowser_webgl_assignment_rank": sunbrowser_webgl_assignment_rank,
              "sunbrowser_webgl_assignment_total": sunbrowser_webgl_assignment_total,
              "sunbrowser_webgl_assignment_seed_sha256_12": (
